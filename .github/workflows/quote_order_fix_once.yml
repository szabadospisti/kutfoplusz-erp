name: one-time quote order fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder quote technical fields
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''<div><label>Talpmélység (m)</label><input id="q_depth" class="input" type="text" inputmode="decimal" oninput="huFormatInput(this,1)" onchange="huFormatInput(this,1);recalculateQuoteMainItem()" onblur="huFormatInput(this,1)"></div>\n    <div><label>Tervezett vízigény</label><input id="q_water_need" class="input" placeholder="pl. 800 l/p"></div>\n    <div><label>Béléscső átmérő (mm)</label><select id="q_pipe_diameter" class="input" title="A projektből érkező átmérő, ajánlatban módosítható" onchange="recalculateQuoteMainItem()"><option value="125">Ø 125 mm</option><option value="160">Ø 160 mm</option><option value="225">Ø 225 mm</option><option value="280">Ø 280 mm</option><option value="315">Ø 315 mm</option></select></div>'''
          new='''<div><label>Béléscső átmérő (mm)</label><select id="q_pipe_diameter" class="input" title="A projektből érkező átmérő, ajánlatban módosítható" onchange="recalculateQuoteMainItem()"><option value="125">Ø 125 mm</option><option value="160">Ø 160 mm</option><option value="225">Ø 225 mm</option><option value="280">Ø 280 mm</option><option value="315">Ø 315 mm</option></select></div>\n    <div><label>Talpmélység (m)</label><input id="q_depth" class="input" type="text" inputmode="decimal" oninput="huFormatInput(this,1)" onchange="huFormatInput(this,1);recalculateQuoteMainItem()" onblur="huFormatInput(this,1)"></div>\n    <div><label>Tervezett vízigény</label><input id="q_water_need" class="input" placeholder="pl. 800 l/p"></div>'''
          if old not in s:
              raise SystemExit('TARGET_HTML_NOT_FOUND')
          s=s.replace(old,new,1)
          marker='<!-- QUOTE_ORDER_FIX_2026_08_28 -->'
          if marker not in s:
              s=s.replace('<head>', '<head>\n'+marker, 1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate quote field order
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          a=s.find('id="q_pipe_diameter"')
          b=s.find('id="q_depth"',a)
          c=s.find('id="q_water_need"',b)
          assert a >= 0 and b > a and c > b
          print('QUOTE_ORDER_VALIDATION=PASS')
          PY
      - name: Commit and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/quote_order_fix_once.yml
          git rm .github/workflows/quote_order_fix_once.yml
          git commit -m 'fix: show diameter before depth in quote technical content'
          git push
