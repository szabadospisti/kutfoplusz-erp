name: Fix quote customer and pricing

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply deterministic quote patch
        run: python3 patch_quote.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script(?:[^>]*)>(.*?)</script>',s,re.S))
          Path('/tmp/all-scripts.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/all-scripts.js
      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: filter quote projects by customer and calculate undocumented price"
          git push
