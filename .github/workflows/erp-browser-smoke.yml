name: ERP Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[browser-smoke-result]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*

      - name: Install Playwright and official JSZip
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0 jszip@3.10.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1

      - name: Verify and repair bundled JSZip
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s jszip.min.js node_modules/jszip/dist/jszip.min.js; then
            cp node_modules/jszip/dist/jszip.min.js jszip.min.js
            printf '%s\n' 'official npm JSZip 3.10.1 restored' >/tmp/jszip-repaired
          fi
          node --check jszip.min.js

      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/erp-http.log 2>&1 &
          sleep 2

      - name: Browser smoke test
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const out = '/tmp/browser-smoke-result.json';
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage();
            const pageErrors = [];
            const consoleErrors = [];
            const requestFailures = [];
            page.on('pageerror', e => pageErrors.push(String(e && e.stack || e)));
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('requestfailed', r => requestFailures.push(`${r.url()} :: ${r.failure()?.errorText || 'unknown'}`));
            try {
              await page.goto('http://127.0.0.1:4173/index.html', {waitUntil:'domcontentloaded', timeout:60000});
              await page.waitForTimeout(1500);
              const result = await page.evaluate(() => ({
                patch: window.KUTFOPLUSZ_QUOTE_VISUAL_FIX || null,
                jszip: typeof window.JSZip,
                jszipVersion: window.JSZip && window.JSZip.version || null,
                ensureJSZip: typeof window.KUTFOPLUSZ_ensureJSZip,
                template: typeof window.KUTFOPLUSZ_QUOTE_TEMPLATE_B64,
                saveQuote: typeof window.saveQuoteFromTemplate,
                openQuote: typeof window.openQuotePage,
                editQuote: typeof window.editQuote,
                recalc: typeof window.recalculateQuoteMainItem,
                collect: typeof window.collectQuoteTemplate,
                exportDocx: typeof window.exportQuoteDoc,
                obsoletePreviewScript: Array.from(document.scripts).some(s => /quote_preview_(pages|vectors)\\.js/i.test(s.src)),
                quoteItemsType: Array.isArray(window.quoteItems) ? 'array' : typeof window.quoteItems
              }));
              const required = ['saveQuote','openQuote','editQuote','recalc','collect','exportDocx'];
              const missing = required.filter(k => result[k] !== 'function');
              const payload = {ok:false,result,pageErrors,consoleErrors,requestFailures,missing};
              fs.writeFileSync(out, JSON.stringify(payload,null,2));
              console.log('BROWSER_SMOKE=' + JSON.stringify(payload));
              if (!result.patch) throw new Error('quote_ui_fix.js runtime marker missing');
              if (result.jszip !== 'function') throw new Error('JSZip is not available in browser runtime');
              if (result.jszipVersion !== '3.10.1') throw new Error('Unexpected JSZip version: ' + result.jszipVersion);
              if (result.ensureJSZip !== 'function') throw new Error('JSZip dependency guard is not installed');
              if (result.template !== 'string') throw new Error('DOCX template global is not loaded');
              if (missing.length) throw new Error('Missing quote runtime functions: ' + missing.join(', '));
              if (result.obsoletePreviewScript) throw new Error('Obsolete PDF preview script is still loaded');
              if (pageErrors.length) throw new Error('Browser page errors: ' + pageErrors.join(' | '));
              payload.ok = true;
              fs.writeFileSync(out, JSON.stringify(payload,null,2));
              await browser.close();
            } catch (err) {
              const payload = {ok:false,error:String(err&&err.stack||err),pageErrors,consoleErrors,requestFailures};
              fs.writeFileSync(out, JSON.stringify(payload,null,2));
              console.error('BROWSER_SMOKE=' + JSON.stringify(payload));
              try { await browser.close(); } catch (_) {}
              process.exit(1);
            }
          })().catch(err => { fs.writeFileSync(out, JSON.stringify({ok:false,error:String(err&&err.stack||err)},null,2)); console.error(err.stack||err); process.exit(1); });
          NODE
          exit $?

      - name: Publish browser smoke result
        if: always()
        shell: bash
        run: |
          if test -f /tmp/browser-smoke-result.json; then
            cp /tmp/browser-smoke-result.json BROWSER_SMOKE_RESULT.json
          else
            printf '%s\n' '{"ok":false,"error":"browser smoke produced no result file"}' > BROWSER_SMOKE_RESULT.json
          fi

      - name: Commit browser smoke repair/result
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BROWSER_SMOKE_RESULT.json
          test -f /tmp/jszip-repaired && git add jszip.min.js || true
          if git diff --cached --quiet; then
            exit 0
          fi
          if test -f /tmp/jszip-repaired; then
            git commit -m '[browser-smoke-result] repair bundled JSZip and capture runtime result'
          else
            git commit -m '[browser-smoke-result] capture browser runtime result'
          fi
          git push origin HEAD:main
