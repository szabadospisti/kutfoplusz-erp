name: ERP Browser Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-smoke:
    if: ${{ !contains(github.event.head_commit.message, '[browser-smoke-result]') && !contains(github.event.head_commit.message, '[browser-smoke-signatures]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Playwright and official JSZip
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0 jszip@3.10.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Verify and repair bundled JSZip
        shell: bash
        run: |
          set -euo pipefail
          if ! cmp -s jszip.min.js node_modules/jszip/dist/jszip.min.js; then
            cp node_modules/jszip/dist/jszip.min.js jszip.min.js
            printf '%s\n' 'official npm JSZip 3.10.1 restored' >/tmp/jszip-repaired
          fi
          node --check jszip.min.js
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/erp-http.log 2>&1 &
          sleep 2
      - name: Browser smoke test
        shell: bash
        run: |
          set +e
          node <<'NODE'
          const fs=require('fs');const {chromium}=require('playwright');const out='/tmp/browser-smoke-result.json';
          (async()=>{const browser=await chromium.launch({headless:true});const page=await browser.newPage();const pageErrors=[],consoleErrors=[],requestFailures=[];page.on('pageerror',e=>pageErrors.push(String(e&&e.stack||e)));page.on('console',m=>{if(m.type()==='error')consoleErrors.push(m.text())});page.on('requestfailed',r=>requestFailures.push(`${r.url()} :: ${r.failure()?.errorText||'unknown'}`));try{await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1500);const result=await page.evaluate(()=>({patch:window.KUTFOPLUSZ_QUOTE_VISUAL_FIX||null,jszip:typeof window.JSZip,jszipVersion:window.JSZip&&window.JSZip.version||null,ensureJSZip:typeof window.KUTFOPLUSZ_ensureJSZip,template:typeof window.KUTFOPLUSZ_QUOTE_TEMPLATE_B64,saveQuote:typeof window.saveQuoteFromTemplate,saveQuoteArity:window.saveQuoteFromTemplate&&window.saveQuoteFromTemplate.length,saveQuoteChunk1:window.saveQuoteFromTemplate?String(window.saveQuoteFromTemplate).slice(0,1200):null,saveQuoteChunk2:window.saveQuoteFromTemplate?String(window.saveQuoteFromTemplate).slice(1200,2400):null,saveQuoteChunk3:window.saveQuoteFromTemplate?String(window.saveQuoteFromTemplate).slice(2400,3600):null,openQuote:typeof window.openQuotePage,editQuote:typeof window.editQuote,recalc:typeof window.recalculateQuoteMainItem,collect:typeof window.collectQuoteTemplate,collectArity:window.collectQuoteTemplate&&window.collectQuoteTemplate.length,collectHead:window.collectQuoteTemplate?String(window.collectQuoteTemplate).slice(0,1200):null,exportDocx:typeof window.exportQuoteDoc,exportDocxArity:window.exportQuoteDoc&&window.exportQuoteDoc.length,exportDocxChunk1:window.exportQuoteDoc?String(window.exportQuoteDoc).slice(0,1500):null,exportDocxChunk2:window.exportQuoteDoc?String(window.exportQuoteDoc).slice(1500,3000):null,obsoletePreviewScript:Array.from(document.scripts).some(s=>/quote_preview_(pages|vectors)\\.js/i.test(s.src)),quoteItemsType:Array.isArray(window.quoteItems)?'array':typeof window.quoteItems,buttons:Array.from(document.querySelectorAll('button')).map(b=>String(b.textContent||'').replace(/\\s+/g,' ').trim()).filter(Boolean).slice(0,80)}));const required=['saveQuote','openQuote','editQuote','recalc','collect','exportDocx'];const missing=required.filter(k=>result[k]!=='function');const payload={ok:false,result,pageErrors,consoleErrors,requestFailures,missing};fs.writeFileSync(out,JSON.stringify(payload,null,2));if(!result.patch||result.jszip!=='function'||result.jszipVersion!=='3.10.1'||result.ensureJSZip!=='function'||result.template!=='string'||missing.length||result.obsoletePreviewScript||pageErrors.length)throw new Error('Browser smoke invariant failed');payload.ok=true;fs.writeFileSync(out,JSON.stringify(payload,null,2));await browser.close()}catch(err){const payload={ok:false,error:String(err&&err.stack||err),pageErrors,consoleErrors,requestFailures};fs.writeFileSync(out,JSON.stringify(payload,null,2));try{await browser.close()}catch(_){}process.exit(1)}})();
          NODE
          exit $?
      - name: Publish result
        if: always()
        shell: bash
        run: |
          test -f /tmp/browser-smoke-result.json && cp /tmp/browser-smoke-result.json BROWSER_SMOKE_RESULT.json || printf '%s\n' '{"ok":false}' > BROWSER_SMOKE_RESULT.json
          cp BROWSER_SMOKE_RESULT.json QUOTE_RUNTIME_SIGNATURES.json
      - name: Commit result and signatures
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add BROWSER_SMOKE_RESULT.json QUOTE_RUNTIME_SIGNATURES.json; test -f /tmp/jszip-repaired && git add jszip.min.js || true; if git diff --cached --quiet; then exit 0; fi; if test -f /tmp/jszip-repaired; then git commit -m '[browser-smoke-signatures] repair JSZip and capture quote runtime signatures'; else git commit -m '[browser-smoke-signatures] capture quote runtime signatures'; fi; git push origin HEAD:main
