name: ERP Browser Smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Playwright and JSZip
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0 jszip@3.10.1 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/erp-http.log 2>&1 &
      - name: Browser smoke and quote persistence
        run: |
          node <<'NODE'
          const fs=require('fs');
          const {chromium}=require('playwright');
          const JSZip=require('jszip');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({acceptDownloads:true});
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            try{
              await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});
              await page.waitForTimeout(1500);
              const runtime=await page.evaluate(()=>({patch:window.KUTFOPLUSZ_QUOTE_VISUAL_FIX||null,jszip:window.JSZip&&window.JSZip.version||null,save:window.eval('typeof save'),db:window.eval('typeof db'),editQuote:typeof window.editQuote,collect:typeof window.collectQuoteTemplate,exportDocx:typeof window.exportQuoteDoc,obsoletePreviewScript:Array.from(document.scripts).some(s=>/quote_preview_(pages|vectors)\.js/i.test(s.src))}));
              if(!runtime.patch||runtime.jszip!=='3.10.1'||runtime.save!=='function'||runtime.db!=='object'||runtime.editQuote!=='function'||runtime.collect!=='function'||runtime.exportDocx!=='function'||runtime.obsoletePreviewScript||errors.length)throw new Error('Browser runtime invariant failed: '+JSON.stringify({runtime,errors}));
              const ids=await page.evaluate(()=>{const d=window.eval('db'),s=window.eval('save'),stamp=Date.now();const projectId=String(stamp),quoteId='E2E-QUOTE-'+stamp;d.projects.push({id:projectId,name:'E2E Browser Smoke Project',status:'Ajánlat',customerId:'__e2e__',location:'E2E helyszín',well:{depth:50,casingDiameter:324,casingSections:[{from:0,to:35,type:'Vak'},{from:35,to:50,type:'Szűrő'}]}});d.quotes.push({id:quoteId,customerId:'__e2e__',projectId,status:'Piszkozat',subject:'E2E 50,0 m öntözőkút',location:'E2E helyszín',depth:50,pipeDiameter:'324',items:[{qty:2,unit:'db',desc:'50,0 m-es kút kivitelezése',price:125000,priceManual:true}]});d.quotes.push({id:'E2E-LEGACY-'+stamp,customerName:'Legacy ügyfél',siteAddress:'Legacy cím',wellDepth:42,casingDiameter:'280',totalNet:840000,status:'Elküldve',subject:'Legacy 42,0 m kút'});d.quotes.push({id:'E2E-ZERO-'+stamp,customerName:'Zero ügyfél',site:'Zero cím',depth:30,pipeDiameter:'324',net:0,status:'Piszkozat',items:[{qty:1,unit:'db',desc:'0 Ft teszt',price:0}]});d.quotes.push({id:'E2E-NORMAL-'+stamp,customerName:'Normal ügyfél',location:'Normal cím',depth:60,pipeDiameter:'324',net:1500000,status:'Elkészítve',items:[{qty:1,unit:'db',desc:'60,0 m kút',price:1500000}]});s();return {projectId,quoteId,legacyId:'E2E-LEGACY-'+stamp,zeroId:'E2E-ZERO-'+stamp,normalId:'E2E-NORMAL-'+stamp};});
              await page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(700);
              const projectNav=await page.evaluate(id=>{window.openProjectPage(id);const p=window.eval('db').projects.find(x=>String(x.id)===String(id));return {hash:location.hash,text:document.getElementById('content')?.textContent||'',normalizedType:typeof p?.id};},ids.projectId);
              if(!projectNav.hash.includes('/project/')||!projectNav.text.includes('E2E Browser Smoke Project')||projectNav.normalizedType!=='string')throw new Error('Project navigation failed: '+JSON.stringify(projectNav));
              await page.evaluate(()=>window.nav('quotes'));await page.waitForTimeout(250);
              const listText=await page.evaluate(()=>document.getElementById('content')?.textContent||'');
              for(const token of [ 'E2E-QUOTE-', 'E2E-LEGACY-', 'E2E-ZERO-', 'E2E-NORMAL-', '50,0 m', '324 mm', 'Legacy ügyfél', 'Zero ügyfél', 'Normal ügyfél' ]) if(!listText.includes(token)) throw new Error('Quote list missing token '+token+'\n'+listText.slice(0,5000));
              const persisted=await page.evaluate(id=>{const d=window.eval('db');return d.quotes.find(x=>String(x.id)===String(id))?.items?.[0]||null;},ids.quoteId);
              if(!persisted||Number(persisted.qty)!==2||persisted.unit!=='db'||persisted.price!==125000||persisted.priceManual!==true)throw new Error('Persistence failed: '+JSON.stringify(persisted));
              await page.evaluate(async id=>{window.editQuote(id);await new Promise(r=>setTimeout(r,500));},ids.quoteId);
              const model=await page.evaluate(()=>{const q=window.collectQuoteTemplate();const x=q?.items?.[0];return {item:x||null,separate:!!(x&&'qty' in x&&'unit' in x&&'desc' in x),depth:document.getElementById('q_depth')?.value||'',diameter:document.getElementById('q_pipe_diameter')?.value||''};});
              if(!model.separate||Number(model.item.qty)!==2||Number(model.item.price)!==125000||Number(model.depth)!==50)throw new Error('Editor normalized data mismatch: '+JSON.stringify(model));
              const dp=page.waitForEvent('download',{timeout:20000});await page.evaluate(()=>window.exportQuoteDoc());const dl=await dp,path=await dl.path();if(!path)throw new Error('DOCX path unavailable');
              const buf=fs.readFileSync(path),zip=await JSZip.loadAsync(buf),xml=await zip.file('word/document.xml').async('string');
              const text=xml.replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#160;/g,' ').replace(/\s+/g,' ').trim();
              if(!/2\s*db\s*50,0\s*m-es\s*kút\s*kivitelezése/i.test(text)||/2\s*db\s*2\s*db\s*50,0\s*m-es\s*kút\s*kivitelezése/i.test(text))throw new Error('DOCX content mismatch: '+text.slice(0,2000));
              await page.evaluate(ids=>{const d=window.eval('db'),s=window.eval('save');const idsToDelete=[ids.quoteId,ids.legacyId,ids.zeroId,ids.normalId];d.quotes=d.quotes.filter(x=>!idsToDelete.includes(String(x.id)));d.projects=d.projects.filter(x=>String(x.id)!==String(ids.projectId));s();},ids);
              await browser.close();
            }catch(e){try{await browser.close()}catch(_){};throw e;}
          })();
          NODE
