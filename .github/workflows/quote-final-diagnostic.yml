name: Quote Final Diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null 2>&1
      - name: Verify quote list and editor normalization
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/erp-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(String(e&&e.stack||e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});await page.waitForTimeout(1600);
            const before=await page.evaluate(()=>({number:String(window.nextQuoteId||''),listPatch:!!window.__KPF_QUOTE_LIST_V2,editor:String(window.editQuote||'')}));
            if(!before.listPatch)throw new Error('quote list patch not installed');
            const ids=await page.evaluate(()=>{const d=window.eval('db'),s=window.eval('save'),projectId='FINAL-DIAG-P-'+Date.now(),quoteId='FINAL-DIAG-Q-'+Date.now();d.projects.push({id:projectId,name:'Final Diagnostic Project',status:'Ajánlat',customerId:'__final__',location:'Final Location',well:{depth:55,casingSections:[{from:0,to:55,type:'Vak',diameter:'324'}]}});d.quotes.push({id:quoteId,customerId:'__final__',projectId,status:'Piszkozat',name:'Final Diagnostic Quote',location:'Final Location',depth:55,pipeDiameter:'324',net:250000,gross:317500,items:[{qty:2,quantity:2,unit:'db',desc:'50,0 m-es kút kivitelezése',price:125000,unitPrice:125000,priceManual:true}]});s();return {projectId,quoteId};});
            await page.reload({waitUntil:'domcontentloaded'});await page.waitForTimeout(700);await page.evaluate(()=>window.nav('quotes'));await page.waitForTimeout(300);
            const list=await page.evaluate(id=>{const root=document.getElementById('content'),row=[...root.querySelectorAll('tbody tr')].find(r=>r.textContent.includes(id));return {text:(row?.textContent||'').replace(/\u00a0/g,' '),headers:[...root.querySelectorAll('thead th')].map(x=>x.textContent.trim())};},ids.quoteId);
            if(!['Fúrási mélység','Csőátmérő','Nettó','Státusz'].every(x=>list.headers.includes(x)))throw new Error('list columns missing: '+JSON.stringify(list));
            if(!list.text.includes('55,0 m')||!list.text.includes('Ø 324 mm')||!list.text.includes('250 000 Ft')||!list.text.includes('Piszkozat'))throw new Error('list values mismatch: '+JSON.stringify(list));
            await page.evaluate(id=>window.editQuote(id),ids.quoteId);await page.waitForTimeout(800);
            const after=await page.evaluate(()=>({items:(()=>{try{return window.eval('quoteItems')}catch(e){return null}})(),depth:document.getElementById('q_depth')?.value||'',diameter:document.getElementById('q_pipe_diameter')?.value||'',row:document.getElementById('q_items')?.innerText||''}));
            const it=after.items?.[0];if(!it||Number(it.qty)!==2||Number(it.price)!==125000||it.unit!=='db')throw new Error('editor normalized stored values incorrectly: '+JSON.stringify(after));
            const newId=await page.evaluate(()=>window.nextQuoteId());if(!/^A-\d{2}-\d{3}$/.test(newId))throw new Error('quote number format mismatch: '+newId);
            console.log('FINAL_QUOTE_DIAGNOSTIC_PASS',JSON.stringify({list,after,newId,errors}));
            await page.evaluate(ids=>{const d=window.eval('db'),s=window.eval('save');d.quotes=d.quotes.filter(x=>String(x.id)!==String(ids.quoteId));d.projects=d.projects.filter(x=>String(x.id)!==String(ids.projectId));s();},ids);await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
