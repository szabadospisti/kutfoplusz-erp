name: ERP Source Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply quote consistency runtime patch
        if: github.event.head_commit.message != 'fix: apply quote consistency runtime patch'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          target=Path('quote_ui_fix.js')
          patch=Path('QUOTE_DATA_CONSISTENCY_PATCH.js').read_text(encoding='utf-8')
          text=target.read_text(encoding='utf-8')
          marker='__KPF_QUOTE_DATA_CONSISTENCY_V1'
          if marker not in text:
              target.write_text(text+'\n\n/* ERP2.0 QUOTE DATA CONSISTENCY */\n'+patch+'\n',encoding='utf-8')
          PY
          if ! git diff --quiet -- quote_ui_fix.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add quote_ui_fix.js
            git commit -m "fix: apply quote consistency runtime patch"
            git push origin HEAD:main
          fi

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s quote_ui_fix.js
          test -s quote_template.js
          test -s jszip.min.js

      - name: Validate quote script wiring
        shell: bash
        run: |
          set -euo pipefail
          if grep -Eiq 'quote_preview_(pages|vectors)\.js' index.html; then
            echo 'ERROR: obsolete quote preview script reference remains in index.html'
            exit 1
          fi
          count=$(grep -Eio 'quote_ui_fix\.js([?][^"'"'"' >]*)?' index.html | wc -l | tr -d ' ')
          test "$count" -eq 1

      - name: Validate native quote calculation guards
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'quoteItems[0].qty=count>0 ? count : 1;' index.html
          grep -Fq 'if(!quoteItems[0].priceManual)' index.html

      - name: Validate DOCX-only quote path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'quote_template.js' index.html
          grep -Fq 'jszip.min.js' index.html
          grep -Fq 'function disablePreviewFunctions' quote_ui_fix.js
          grep -Eq 'window\.previewQuote=(function|\(\)=>)' quote_ui_fix.js
          grep -Eq 'window\.printExactPdfPreview=(function|\(\)=>)' quote_ui_fix.js
          grep -Eq 'window\.printQuote=(function|\(\)=>)' quote_ui_fix.js
          test ! -e quote_preview_pages.js
          test ! -e quote_preview_vectors.js

      - name: Validate canonical pipe catalog identity
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'window.KUTFOPLUSZ_PIPE_MATERIAL_IDENTITY' quote_ui_fix.js
          grep -Fq 'materialKey' quote_ui_fix.js
          grep -Fq 'casingMaterialKey' quote_ui_fix.js
          grep -Fq 'catalog-exact' quote_ui_fix.js
          grep -Fq 'catalog-missing' quote_ui_fix.js
          grep -Fq 'CASING|' quote_ui_fix.js
          grep -Fq 'FILTER' quote_ui_fix.js
          grep -Fq 'BLANK' quote_ui_fix.js

      - name: Validate quote normalization contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '__KPF_QUOTE_DATA_CONSISTENCY_V1' quote_ui_fix.js
          grep -Fq 'window.KUTFOPLUSZ_QUOTE_NORMALIZE' quote_ui_fix.js
          grep -Fq '__KPF_QUOTE_PAGE_NORMALIZED' quote_ui_fix.js
          grep -Fq '__KPF_RECALC_GUARD' quote_ui_fix.js

      - name: JavaScript syntax check
        shell: bash
        run: |
          set -euo pipefail
          node --check quote_ui_fix.js
          node --check quote_template.js
          python3 - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i, block in enumerate(blocks, 1):
                  p=Path(td)/f'inline_{i}.js'
                  p.write_text(block, encoding='utf-8')
                  r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
                  if r.returncode:
                      raise SystemExit(f'inline script {i} syntax error:\n{r.stderr}')
          print(f'Checked {len(blocks)} inline script blocks')
          PY
