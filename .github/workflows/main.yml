name: Deploy Kútfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject ERP modules and stable navigation
        shell: python
        run: |
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          patches = [
              'customer-work-types.js','ui-polish.js','ai-quote-prep.js',
              'warehouse-materials.js','warehouse-material-delete.js','warehouse-material-edit.js','erp-fixes.js',
              'machine-fleet-actions.js','erp-delete-manager.js','customer-details-actions.js','customer-details-dom-fix.js'
          ]
          marker='</script>'; pos=page.rfind(marker)
          if pos<0: raise SystemExit('index.html: closing script tag not found')
          page=page[:pos]+'\n'+'\n'.join(Path(p).read_text(encoding='utf-8') for p in patches)+'\n'+page[pos:]
          machine_script='<script src="machine-fleet-final.js?v=1"></script>\n<script src="machine-profile-native.js?v=2"></script>\n<script src="machine-profile-edit-inline.js?v=1"></script>\n'
          if 'machine-fleet-final.js' not in page:
              page=page.replace('</body>',machine_script+'</body>',1)
          else:
              if 'machine-profile-native.js' not in page:
                  page=page.replace('</body>','<script src="machine-profile-native.js?v=2"></script>\n</body>',1)
              if 'machine-profile-edit-inline.js' not in page:
                  page=page.replace('</body>','<script src="machine-profile-edit-inline.js?v=1"></script>\n</body>',1)
          Path('index.html').write_text(page,encoding='utf-8')

      - name: Verify generated page
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          required=['machine-fleet-final.js','machine-profile-native.js','machine-profile-edit-inline.js','kpDeleteCustomer','kpDeleteProject','kpDeleteQuote','kpDeleteWorklog','customer-details-dom-fix','Ajánlatok','Projektek']
          missing=[x for x in required if x not in page]
          if missing: raise SystemExit('BUILD ERROR: '+', '.join(missing))
          print('OK: stable ERP modules present; native machine profile and inline edit loaded last')

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
