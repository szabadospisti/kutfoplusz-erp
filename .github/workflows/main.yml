name: Deploy Kútfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject ERP modules and stable navigation
        shell: python
        run: |
          import os
          import re
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')

          # Remove every legacy Géppark script tag before injecting the
          # single authoritative CRUD module.
          legacy = [
              'machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js',
              'machine-fleet-stable.js','machine-new-form.js','machine-new-form-v2.js',
              'machine-new-unified.js','machine-profile-native.js','machine-profile-page.js',
              'machine-profile-readonly.js','machine-profile-edit-inline.js',
              'fleet-fallback.js','fleet-machine-profile.js'
          ]
          for name in legacy:
              pattern = rf'<script\b[^>]*\bsrc=["\'][^"\']*{re.escape(name)}(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*'
              page = re.sub(pattern, '', page, flags=re.IGNORECASE)

          patches = [
              'customer-work-types.js','ui-polish.js','ai-quote-prep.js',
              'warehouse-materials.js','warehouse-material-delete.js','warehouse-material-edit.js','erp-fixes.js',
              'erp-delete-manager.js','customer-details-actions.js','customer-details-dom-fix.js'
          ]
          marker='</script>'; pos=page.rfind(marker)
          if pos<0: raise SystemExit('index.html: closing script tag not found')
          page=page[:pos]+'\n'+'\n'.join(Path(p).read_text(encoding='utf-8') for p in patches)+'\n'+page[pos:]

          version=os.environ.get('GITHUB_SHA','dev')
          machine_script=f'<script src="machine-fleet-crud.js?v={version}"></script>\n'
          page=page.replace('</body>',machine_script+'</body>',1)
          Path('index.html').write_text(page,encoding='utf-8')

      - name: Verify generated page
        shell: python
        run: |
          import re
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          required=['machine-fleet-crud.js','kpDeleteCustomer','kpDeleteProject','kpDeleteQuote','kpDeleteWorklog','customer-details-dom-fix','Ajánlatok','Projektek']
          missing=[x for x in required if x not in page]
          if missing: raise SystemExit('BUILD ERROR: '+', '.join(missing))
          forbidden=['machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js','machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js','machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js','fleet-fallback.js','fleet-machine-profile.js']
          script_srcs=re.findall(r'<script\b[^>]*\bsrc=["\']([^"\']+)["\'][^>]*>',page,re.IGNORECASE)
          present=[x for x in forbidden if any(x in src for src in script_srcs)]
          if present: raise SystemExit('BUILD ERROR: legacy machine script loads present: '+', '.join(present))
          machine_loads=[src for src in script_srcs if 'machine-fleet-crud.js' in src]
          if len(machine_loads)!=1: raise SystemExit('BUILD ERROR: machine-fleet-crud.js is not loaded exactly once')
          print('OK: one authoritative machine CRUD module, deterministic cleanup, cache-busted per commit')

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
