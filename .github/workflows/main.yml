name: Deploy Kútfő Plusz ERP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  administration: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build clean Géppark + Rendszer Workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          page=p.read_text(encoding='utf-8')
          legacy=['machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js','machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js','machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js','fleet-fallback.js','fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js','machine-fleet-native.js']
          for name in legacy:
            pattern=r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*'
            page=re.sub(pattern,'',page,flags=re.I)
          fleet=Path('machine-fleet.js').read_text(encoding='utf-8')
          system=Path('system-workflow.js').read_text(encoding='utf-8')
          injection='<script>\n'+fleet+'\n</script>\n<script>\n'+system+'\n</script>\n'
          page=page.replace('</body>',injection+'</body>',1)
          if 'id="system-workflow-nav"' not in page:
            btn='<button class="nav" id="system-workflow-nav" type="button" onclick="window.openSystemWorkflow&&window.openSystemWorkflow()"><i>⚙</i> Rendszer</button>'
            m=re.search(r'(<button[^>]*class=["\'][^"\']*nav[^"\']*["\'][^>]*>\s*<i>[^<]*</i>\s*Riportok\s*</button>)',page,re.I)
            if not m:
              raise SystemExit('BUILD ERROR: Riportok nav item not found')
            page=page[:m.end()]+btn+page[m.end():]
          p.write_text(page,encoding='utf-8')
      - name: Verify build
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          forbidden=['machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js','machine-fleet-native.js']
          for x in forbidden:
            if x in page: raise SystemExit('BUILD ERROR: legacy Géppark reference remains: '+x)
          required=['id="system-workflow-nav"','Workflow / Deploy','actions/runs?branch=main','function create()','function edit(id)','function profile(id)','function view()','views.machines=view']
          for x in required:
            if x not in page: raise SystemExit('BUILD ERROR: missing component: '+x)
          print('OK: static Rendszer nav + clean Géppark + Workflow')
      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check machine-fleet.js
          node --check system-workflow.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Force Pages to GitHub Actions source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsS -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"build_type":"workflow","source":{"branch":"main","path":"/"}}'
          echo "OK: GitHub Pages source is now GitHub Actions."
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Cancel stale GitHub Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          echo "Checking for stale GitHub Pages deployments..."
          deployments="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "${api}/deployments?environment=github-pages&per_page=20")"
          echo "$deployments" | jq -r '.[].sha' | while read -r sha; do
            [ -z "$sha" ] && continue
            [ "$sha" = "$GITHUB_SHA" ] && continue
            status="$(curl -fsSL -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "${api}/pages/deployments/${sha}" | jq -r '.status // empty' || true)"
            if [ "$status" = "in_progress" ]; then
              echo "Cancelling stale Pages deployment: $sha"
              curl -fsS -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2026-03-10" "${api}/pages/deployments/${sha}/cancel"
              echo
            fi
          done
          sleep 5
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
