name: Deploy Kutfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject ERP customer/work model and AI inbox pilot
        shell: python
        run: |
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          for patch_name in ['customer-work-types.js', 'ai-inbox-pilot.js']:
              patch = Path(patch_name).read_text(encoding='utf-8')
              marker = '</script>'
              pos = page.rfind(marker)
              if pos < 0:
                  raise SystemExit(f'index.html: closing script tag not found for {patch_name}')
              page = page[:pos] + '\n' + patch + '\n' + page[pos:]
          Path('index.html').write_text(page, encoding='utf-8')
          print('Customer/work model and AI inbox pilot injected into ERP')

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
