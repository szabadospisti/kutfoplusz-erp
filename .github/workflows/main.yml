name: Deploy Kútfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify JavaScript syntax
        shell: bash
        run: |
          set -e
          for file in auth-core.js machine-fleet.js machine-fleet-bridge.js system-workflow.js erp-fixes.js customer-crud-central.js; do
            if [ -f "$file" ]; then
              node --check "$file"
            fi
          done
          echo "JavaScript syntax check passed."

      - name: Verify required ERP files
        shell: bash
        run: |
          set -e
          test -f index.html
          test -f auth-core.js
          echo "Required ERP files are present."

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
