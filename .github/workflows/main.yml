name: Deploy Kutfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject ERP customer, work model and UI polish
        shell: python
        run: |
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          patches = [
              Path('customer-work-types.js').read_text(encoding='utf-8'),
              Path('ui-polish.js').read_text(encoding='utf-8'),
          ]
          marker = '</script>'
          pos = page.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html: closing script tag not found')
          page = page[:pos] + '\n' + '\n'.join(patches) + '\n' + page[pos:]
          Path('index.html').write_text(page, encoding='utf-8')
          print('Customer/work model and UI polish injected into ERP')

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
