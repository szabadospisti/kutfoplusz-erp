name: Deploy Kútfő Plusz ERP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build clean Géppark + Rendszer Workflow
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          page=p.read_text(encoding='utf-8')
          legacy=['machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js','machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js','machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js','fleet-fallback.js','fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js','machine-fleet-native.js']
          for name in legacy:
            pattern=r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*'
            page=re.sub(pattern,'',page,flags=re.I)
          fleet=Path('machine-fleet.js').read_text(encoding='utf-8')
          fleet=fleet.replace('views.machines=view;return true;','views.machines=view;if(typeof current!==\'undefined\'&&current===\'machines\'&&typeof render===\'function\')render();return true;')
          system=Path('system-workflow.js').read_text(encoding='utf-8')
          bridge=Path('machine-fleet-bridge.js').read_text(encoding='utf-8')
          injection='<script>\n'+fleet+'\n</script>\n<script>\n'+system+'\n</script>\n<script>\n'+bridge+'\n</script>\n'
          page=page.replace('</body>',injection+'</body>',1)
          guard='''<script>\n(function(){\n  function fleetActive(){\n    var a=document.querySelector('.nav.active');\n    return !!(a && /Géppark/i.test(a.textContent||''));\n  }\n  function forceFleet(){\n    try{\n      if(!fleetActive()) return;\n      if(typeof views==='undefined' || !views || typeof views.machines!=='function') return;\n      var c=document.getElementById('content')||document.querySelector('.content');\n      if(!c) return;\n      c.innerHTML=views.machines();\n    }catch(e){ console.error('Géppark render guard:',e); }\n  }\n  document.addEventListener('click',function(e){\n    var n=e.target && e.target.closest ? e.target.closest('.nav') : null;\n    if(n && /Géppark/i.test(n.textContent||'')){\n      setTimeout(forceFleet,0);\n      setTimeout(forceFleet,80);\n      setTimeout(forceFleet,250);\n    }\n  },true);\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){\n    setTimeout(forceFleet,0); setTimeout(forceFleet,100); setTimeout(forceFleet,300);\n  });\n  else { setTimeout(forceFleet,0); setTimeout(forceFleet,100); setTimeout(forceFleet,300); }\n})();\n</script>\n'''
          page=page.replace('</body>',guard+'</body>',1)
          if 'id="system-workflow-nav"' not in page:
            btn='<button class="nav" id="system-workflow-nav" type="button" onclick="window.openSystemWorkflow&&window.openSystemWorkflow()"><i>⚙</i> Rendszer</button>'
            m=re.search(r'(<button[^>]*class=["\'][^"\']*nav[^"\']*["\'][^>]*>\s*<i>[^<]*</i>\s*Riportok\s*</button>)',page,re.I)
            if not m:
              raise SystemExit('BUILD ERROR: Riportok nav item not found')
            page=page[:m.end()]+btn+page[m.end():]
          p.write_text(page,encoding='utf-8')
      - name: Verify single central save path
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          fixes=Path('erp-fixes.js').read_text(encoding='utf-8')
          if 'function save(' not in page:
            raise SystemExit('BUILD ERROR: central save() is missing from index.html')
          if 'async function supabaseCloudSave' not in page:
            raise SystemExit('BUILD ERROR: central Supabase save is missing from index.html')
          if 'window.save=' in fixes or 'window.save =' in fixes:
            raise SystemExit('BUILD ERROR: erp-fixes.js still overrides window.save')
          if '/rest/v1/erp_state' in fixes or 'from(\'erp_state\')' in fixes or 'from("erp_state")' in fixes:
            raise SystemExit('BUILD ERROR: erp-fixes.js still contains a duplicate erp_state writer')
          print('OK: exactly one central save path; erp-fixes is loader-only')
      - name: Verify build
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          forbidden=['machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js','machine-fleet-native.js']
          for x in forbidden:
            if x in page: raise SystemExit('BUILD ERROR: legacy Géppark reference remains: '+x)
          required=['id="system-workflow-nav"','Workflow / Deploy','actions/runs?branch=main','function create()','function edit(id)','function profile(id)','function view()','views.machines=view','forceFleet','__gfCreate','__gfProfile']
          for x in required:
            if x not in page: raise SystemExit('BUILD ERROR: missing component: '+x)
          print('OK: static Rendszer nav + final Géppark bridge + runtime guard')
      - name: JavaScript syntax check
        shell: bash
        run: |
          node --check machine-fleet.js
          node --check machine-fleet-bridge.js
          node --check system-workflow.js
          node --check erp-fixes.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
