name: Deploy Kútfő Plusz ERP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build clean Géppark
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          page=p.read_text(encoding='utf-8')

          legacy=[
            'machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js',
            'machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js',
            'machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js',
            'fleet-fallback.js','fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js',
            'machine-fleet-nav-guard.js','machine-fleet-native.js'
          ]

          # Remove every old external Géppark script. The previous workflow used
          # an over-escaped regex, so those tags were never actually removed.
          for name in legacy:
              pattern=r'<script[^>]+src=["\'][^"\']*'+re.escape(name)+r'(?:\?[^"\']*)?["\'][^>]*>\s*</script>\s*'
              page=re.sub(pattern,'',page,flags=re.I)

          module=Path('machine-fleet.js').read_text(encoding='utf-8')
          page=page.replace('</body>','<script>\n'+module+'\n</script>\n</body>',1)
          p.write_text(page,encoding='utf-8')

      - name: Verify Géppark
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          forbidden=[
            'machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js',
            'machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js',
            'machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js',
            'fleet-fallback.js','fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js',
            'machine-fleet-nav-guard.js','machine-fleet-native.js'
          ]
          for x in forbidden:
              if x in page: raise SystemExit('BUILD ERROR: legacy Géppark reference remains: '+x)
          required=['function create()','function edit(id)','function profile(id)','function view()','views.machines=view','__fleetCreate','__fleetEdit','__fleetProfile','__fleetDelete']
          for x in required:
              if x not in page: raise SystemExit('BUILD ERROR: missing clean Géppark component: '+x)
          print('OK: one clean Géppark CRUD implementation')

      - name: JavaScript syntax check
        shell: bash
        run: node --check machine-fleet.js

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
