name: Deploy Kútfő Plusz ERP
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Build ERP
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          page=p.read_text(encoding='utf-8')
          legacy=[
            'machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js',
            'machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js',
            'machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js','fleet-fallback.js',
            'fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js',
            'machine-fleet-native.js'
          ]
          for name in legacy:
              page=re.sub(r'<script\\b[^>]*\\bsrc=["\\'][^"\\']*'+re.escape(name)+r'(?:\\?[^"\\']*)?["\\'][^>]*>\\s*</script>\\s*','',page,flags=re.I)
          module=Path('machine-fleet.js').read_text(encoding='utf-8')
          page=page.replace('</body>','<script>\\n'+module+'\\n</script>\\n</body>',1)
          p.write_text(page,encoding='utf-8')
      - name: Verify single Géppark implementation
        shell: python
        run: |
          from pathlib import Path
          page=Path('index.html').read_text(encoding='utf-8')
          forbidden=[
            'machine-fleet-actions.js','machine-fleet-dom-fix.js','machine-fleet-final.js','machine-fleet-stable.js',
            'machine-new-form.js','machine-new-form-v2.js','machine-new-unified.js','machine-profile-native.js',
            'machine-profile-page.js','machine-profile-readonly.js','machine-profile-edit-inline.js','fleet-fallback.js',
            'fleet-machine-profile.js','machine-fleet-crud.js','machine-fleet-crud-fix.js','machine-fleet-nav-guard.js','machine-fleet-native.js'
          ]
          for x in forbidden:
              if x in page: raise SystemExit('BUILD ERROR: legacy fleet reference remains: '+x)
          for x in ['function create()','function edit(id)','function profile(id)','function view()','views.machines=view','data-profile']:
              if x not in page: raise SystemExit('BUILD ERROR: new fleet implementation missing: '+x)
          print('OK: one clean Géppark V2 implementation')
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
