name: Deploy Kutfő Plusz ERP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Inject ERP modules and stable inbox navigation
        shell: python
        run: |
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')

          nav_marker = '<nav id="nav">'
          inbox_button = '<button class="nav" data-page="inbox" onclick="openInbox()"><i>📥</i>Beérkező dokumentumok</button>'
          if 'data-page="inbox"' not in page:
              if nav_marker not in page:
                  raise SystemExit('index.html: #nav marker not found')
              page = page.replace(nav_marker, nav_marker + '\n    ' + inbox_button, 1)

          patches = [
              Path('customer-work-types.js').read_text(encoding='utf-8'),
              Path('ui-polish.js').read_text(encoding='utf-8'),
              Path('ai-inbox-pilot.js').read_text(encoding='utf-8'),
              Path('ai-quote-prep.js').read_text(encoding='utf-8'),
              Path('inbox-file-upload.js').read_text(encoding='utf-8'),
              Path('warehouse-materials.js').read_text(encoding='utf-8'),
              Path('warehouse-material-delete.js').read_text(encoding='utf-8'),
              Path('warehouse-material-edit.js').read_text(encoding='utf-8'),
              Path('machine-fleet-dom-fix.js').read_text(encoding='utf-8'),
              Path('fleet-machine-profile.js').read_text(encoding='utf-8'),
          ]
          marker = '</script>'
          pos = page.rfind(marker)
          if pos < 0:
              raise SystemExit('index.html: closing script tag not found')

          fallback = r'''
(function(){
  function fleetFallback(){
    const tables=[...document.querySelectorAll('table')];
    const table=tables.find(t=>/GÉP/i.test(t.innerText||'') && /TÍPUS/i.test(t.innerText||'') && /ÜZEMÓRA/i.test(t.innerText||''));
    if(!table)return;
    const rows=[...table.querySelectorAll('tbody tr')].filter(r=>r.querySelectorAll('td').length>=5);
    if(!rows.length)return;
    const head=table.querySelector('thead tr');
    if(head&&!head.querySelector('[data-fleet-fallback-head]')){const th=document.createElement('th');th.dataset.fleetFallbackHead='1';th.textContent='MŰVELET';head.appendChild(th);}
    rows.forEach(row=>{
      if(row.querySelector('[data-fleet-fallback]'))return;
      const td=document.createElement('td');td.dataset.fleetFallback='1';
      td.innerHTML='<button type="button" class="btn secondary small" data-fleet-open>Adatlap</button> <button type="button" class="btn small" data-fleet-edit>✏️ Szerkesztés</button> <button type="button" class="btn danger small" data-fleet-delete>🗑️ Törlés</button>';
      row.appendChild(td);
      const cells=[...row.querySelectorAll('td')];
      const name=()=>cells[0]?.innerText.trim()||'';
      const type=()=>cells[1]?.innerText.trim()||'';
      const open=()=>{
        const m=document.createElement('div');m.className='modal';m.innerHTML='<div class="modalbox"><div class="modalhead"><h2>Gép szerkesztése</h2><button class="icon" data-x>×</button></div><div class="modalbody"><div class="formgrid"><div class="field"><label>Gép neve</label><input class="input" id="ffn"></div><div class="field"><label>Típus / modell</label><input class="input" id="fft"></div><div class="field"><label>Üzemóra</label><input class="input" id="ffh" type="number"></div><div class="field"><label>Következő szerviz</label><input class="input" id="ffs" type="number"></div><div class="field full"><label>Megjegyzés</label><textarea class="textarea" id="ffm"></textarea></div></div><div class="modalfoot"><button class="btn secondary" data-x>Mégse</button><button class="btn" data-save>💾 Mentés</button></div></div></div>';
        document.body.appendChild(m);m.querySelector('#ffn').value=name();m.querySelector('#fft').value=type();m.querySelector('#ffh').value=cells[2]?.innerText.trim()||'';m.querySelector('#ffs').value=cells[3]?.innerText.trim()||'';
        m.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>m.remove());
        m.querySelector('[data-save]').onclick=()=>{cells[0].textContent=m.querySelector('#ffn').value.trim();cells[1].textContent=m.querySelector('#fft').value.trim();cells[2].textContent=m.querySelector('#ffh').value;cells[3].textContent=m.querySelector('#ffs').value;m.remove();};
      };
      td.querySelector('[data-fleet-edit]').onclick=open;
      td.querySelector('[data-fleet-open]').onclick=open;
      td.querySelector('[data-fleet-delete]').onclick=()=>{if(confirm('Biztosan törlöd ezt a gépet?'))row.remove();};
    });
  }
  const run=()=>{try{fleetFallback();}catch(e){console.error('Fleet fallback',e);}};
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
  setInterval(run,1000);
})();
'''
          page = page[:pos] + '\n' + '\n'.join(patches) + '\n' + fallback + '\n' + page[pos:]
          Path('index.html').write_text(page, encoding='utf-8')
          print('ERP modules injected; full machine profile controls and fallback included')

      - name: Verify generated page
        shell: python
        run: |
          from pathlib import Path
          page = Path('index.html').read_text(encoding='utf-8')
          required = [
              'data-page="inbox"',
              'Beérkező dokumentumok',
              'kpRecordMaterialUse',
              'Projekt anyagigény',
              'Anyagok szerkesztése',
              'Változtatások mentése',
              'kpDeleteMaterial',
              'Géppark szerkesztése',
              'Gép szerkesztése',
              'Szervizelőzmények',
              'Projekt / használat',
              'kpFleetToast',
              'data-fleet-fallback',
          ]
          missing = [x for x in required if x not in page]
          if missing:
              raise SystemExit('BUILD ERROR: missing modules: ' + ', '.join(missing))
          print('OK: inbox, warehouse and machine fleet controls present')

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
