name: Apply Quote List Normalizer
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: normalize quote list data') }}
    runs-on: ubuntu-latest
    steps:
      - name: Append live quote list normalization layer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const owner='szabadospisti',repo='kutfoplusz-erp',branch='main';
          const H={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(p){const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${branch}`,{headers:H});if(!r.ok)throw Error(await r.text());return r.json();}
          async function put(p,sha,s,msg){const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${p}`,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:Buffer.from(s).toString('base64'),sha,branch})});if(!r.ok)throw Error(await r.text());}
          const f=await get('quote_ui_fix.js');
          let s=Buffer.from(f.content,'base64').toString('utf8');
          if(!s.includes('ERP2.0-QUOTE-LIST-NORMALIZED-2026-08-30')){
            s += `\n/* ERP2.0-QUOTE-LIST-NORMALIZED-2026-08-30 */\n(function(){\n  "use strict";\n  const PATCH="ERP2.0-QUOTE-LIST-NORMALIZED-2026-08-30";\n  function num(v){if(v===null||v===undefined||v==="")return NaN;const n=Number(String(v).replace(/\\s/g,"").replace(/,/g,"."));return Number.isFinite(n)?n:NaN;}\n  function firstFinite(values,allowZero=true){for(const v of values){const n=num(v);if(Number.isFinite(n)&&(allowZero||n>0))return n;}return 0;}\n  function projectForQuote(q){try{const id=q?.projectId??q?.sourceProjectId??q?.linkedProjectId;return (typeof db!=="undefined"&&Array.isArray(db.projects)&&id!=null)?db.projects.find(p=>String(p.id)===String(id))||null:null;}catch(e){return null;}}\n  function depthFromText(s){const m=String(s||"").replace(/,/g,".").match(/(?:\\b|^)(\\d+(?:\\.\\d+)?)\\s*m(?:\\b|$)/i);return m?num(m[1]):NaN;}\n  function diameterFromText(s){const m=String(s||"").replace(/,/g,".").match(/(?:Ø\\s*)?(\\d+(?:\\.\\d+)?(?:\\s*\\/\\s*\\s*\\d+(?:\\.\\d+)?)?)\\s*mm\\b/i);return m?m[1].replace(/\\s+/g,""):"";}\n  function projectDiameter(p){try{if(typeof window.KUTFOPLUSZ_PIPE_MATERIAL_IDENTITY==="object"){}if(typeof window.KUTFOPLUSZ_PIPE_MATERIAL_IDENTITY==="function"){const r=window.KUTFOPLUSZ_PIPE_MATERIAL_IDENTITY();if(r&&typeof r.permitDiameter==="function"){const d=r.permitDiameter(p);if(d)return String(d);}}}catch(e){}const w=p?.well||{};const sections=Array.isArray(w.casingSections)?w.casingSections:[];for(const sec of sections){for(const v of [sec?.diameter,sec?.pipeDiameter,sec?.casingDiameter,sec?.technicalData,sec?.technical,sec?.spec,sec?.[3]]){const d=diameterFromText(v);if(d)return d;const n=num(v);if(Number.isFinite(n)&&n>0)return String(n);}}for(const v of [w.casingDiameter,p?.casingDiameter,p?.védőcsőÁtmérő]){const n=num(v);if(Number.isFinite(n)&&n>0)return String(n);}return "";}\n  function itemRows(q){const raw=Array.isArray(q?.items)?q.items:[];return raw.map(x=>({qty:firstFinite([x?.qty,x?.quantity,x?.count],true),price:firstFinite([x?.price,x?.unitPrice,x?.unitPriceNet],true),desc:String(x?.desc??x?.description??x?.name??"")}));}\n  function normalized(q){const p=projectForQuote(q),items=itemRows(q);const subject=String(q?.subject??q?.name??q?.title??q?.description??p?.name??"").trim();const depth=firstFinite([q?.depth,q?.wellDepth,q?.talpDepth,p?.well?.depth,p?.depth],false)||depthFromText(subject)||depthFromText(q?.name);let diameter=String(q?.pipeDiameter??q?.diameter??q?.casingDiameter??"").trim();if(!diameter)diameter=projectDiameter(p);if(!diameter){for(const x of items){diameter=diameterFromText(x.desc);if(diameter)break;}}let net=firstFinite([q?.net,q?.netTotal,q?.totalNet],false);if(!Number.isFinite(net)||net<=0){net=items.reduce((s,x)=>s+(num(x.qty)||0)*(num(x.price)||0),0);net=Math.round(net*100)/100;}else net=Math.round(net*100)/100;let gross=firstFinite([q?.gross,q?.grossTotal,q?.totalGross],false);if(!Number.isFinite(gross)||gross<=0)gross=Math.round(net*1.27);const customer=(()=>{try{if(typeof cust==="function")return String(cust(q?.customerId)||q?.customerName||q?.clientName||"");}catch(e){}return String(q?.customerName??q?.clientName??q?.customer??"");})();const location=String(q?.location??q?.site??q?.siteAddress??q?.address??p?.location??p?.address??"").trim();const name=subject||String(q?.name??p?.name??"").trim();return {q,p,id:String(q?.id??q?.quoteNumber??q?.number??""),name,customer,location,depth,diameter,net,gross,status:String(q?.status??"Piszkozat")};}\n  function esc2(v){try{if(typeof esc==="function")return esc(v);return String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\\\"":"&quot;","'":"&#39;"}[c]));}catch(e){return String(v??"");}}\n  function money2(v){try{if(typeof money==="function")return money(v);return `${Math.round(num(v)||0).toLocaleString("hu-HU")} Ft`;}catch(e){return `${Math.round(num(v)||0).toLocaleString("hu-HU")} Ft`;}}\n  function row(q){const x=normalized(q);const d=Number.isFinite(x.depth)?`${x.depth.toLocaleString("hu-HU",{minimumFractionDigits:1,maximumFractionDigits:1})} m`:"—";const dia=x.diameter?`Ø ${x.diameter} mm`:"—";return `<tr>\n<td><a href="#" class="link" data-quote-id="${esc2(x.id)}" onclick="openQuotePage('${esc2(x.id)}');return false" title="Árajánlat megnyitása"><b>${esc2(x.id)}</b></a><br><span class="label">${esc2(x.name)}</span></td>\n<td>${esc2(x.customer)}</td><td>${esc2(x.location)}</td><td>${d}</td><td>${dia}</td><td>${money2(x.net)}</td>\n<td><select class="quote-status-pill quote-status-${typeof statusClass==='function'?statusClass(x.status):'draft'}" onchange="changeQuoteStatus('${esc2(x.id)}',this.value)" aria-label="Státusz">${["Piszkozat","Elkészítve","Elküldve","Tárgyalás alatt","Elfogadva","Elutasítva","Lezárva"].map(st=>`<option value="${esc2(st)}" ${x.status===st?'selected':''}>${esc2(st)}</option>`).join("")}</select></td>\n<td style="white-space:nowrap"><div style="display:flex;gap:6px;align-items:center;justify-content:flex-end"><button class="btn secondary small" onclick="openQuoteEditorPage('${esc2(x.id)}');return false;">Megnyitás</button>${x.status==="Elfogadva"?`<button class="btn small" onclick="convertQuote('${esc2(x.id)}')">→ Projekt</button>`:""}</div></td>\n</tr>`;}\n  function patch(){if(typeof window.quoteRows!=="function"||window.__KPF_QUOTE_LIST_NORMALIZED)return;const original=window.quoteRows;window.quoteRows=function(arr){const rows=Array.isArray(arr)?arr:(typeof db!=="undefined"&&Array.isArray(db.quotes)?db.quotes:[]);const statuses=["Piszkozat","Elkészítve","Elküldve","Tárgyalás alatt","Elfogadva","Elutasítva","Lezárva"];const body=rows.map(row).join("");const total=rows.reduce((s,q)=>s+normalized(q).net,0);window.__KPF_QUOTE_LIST_NORMALIZED=true;return `<div class="tablewrap"><table class="table"><thead><tr><th>Ajánlat</th><th>Ügyfél</th><th>Helyszín</th><th>Fúrási mélység</th><th>Csőátmérő</th><th>Nettó</th><th>Státusz</th><th></th></tr></thead><tbody>${body}</tbody></table></div>`;};window.KUTFOPLUSZ_QUOTE_LIST_NORMALIZER=PATCH;try{if(location.hash==="#/quotes"||location.hash==="#quotes")window.nav&&window.nav('quotes');}catch(e){}}\n  patch();window.addEventListener("load",patch);window.addEventListener("hashchange",()=>setTimeout(patch,0));setTimeout(patch,100);setTimeout(patch,500);setTimeout(patch,1200);\n})();\n`;
            await put('quote_ui_fix.js',f.sha,s,'fix: normalize quote list data');
            console.log('quote list normalization appended');
          } else console.log('already patched');
          NODE
