name: Install central Supabase Auth

on:
  workflow_dispatch:
  push:
    paths:
      - 'supabase-auth-core.js'
      - 'supabase-auth-bootstrap.js'
      - '.github/workflows/install-central-supabase-auth.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install central Auth bootstrap
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="supabase-auth-bootstrap.js?v=1"></script>'
          if marker in s:
              print('Central Auth bootstrap already installed')
              raise SystemExit(0)

          # Insert immediately after supabase_config.js so the bridge is present
          # before the ERP's existing Supabase/login code executes.
          needles = [
              'supabase_config.js',
              'supabase-config.js'
          ]
          pos = -1
          end = -1
          for needle in needles:
              i = s.find(needle)
              if i >= 0:
                  start = s.rfind('<script', 0, i)
                  end = s.find('</script>', i)
                  if start >= 0 and end >= 0:
                      end += len('</script>')
                      pos = start
                      break
          if pos < 0 or end < 0:
              raise SystemExit('FAIL-CLOSED: Supabase config script tag not found; no changes made.')

          s = s[:end] + '\n' + marker + s[end:]
          p.write_text(s, encoding='utf-8')

      - name: Verify
        shell: bash
        run: |
          grep -n 'supabase-auth-bootstrap.js' index.html
          git diff --check
          git diff -- index.html

      - name: Commit installation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Install central Supabase Auth bootstrap'
          git push
