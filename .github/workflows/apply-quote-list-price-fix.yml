name: Apply quote list price fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: quote list display totals') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch quote list totals
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const owner='szabadospisti',repo='kutfoplusz-erp',branch='main';
          const H={Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
          async function get(p){const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${p}?ref=${branch}`,{headers:H});if(!r.ok)throw Error(await r.text());return r.json();}
          async function put(p,sha,s,msg){const r=await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${p}`,{method:'PUT',headers:{...H,'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:Buffer.from(s).toString('base64'),sha,branch})});if(!r.ok)throw Error(await r.text());}
          const f=await get('all.js');
          let s=Buffer.from(f.content,'base64').toString('utf8');
          const helper=`\nfunction quoteDisplayGross(q){\n  const gross=Number(q?.gross);\n  if(Number.isFinite(gross)&&gross>0) return gross;\n  const netCandidates=[Number(q?.net),Number(q?.netTotal),Number(q?.totalNet)];\n  const storedNet=netCandidates.find(v=>Number.isFinite(v)&&v>0);\n  if(storedNet) return Math.round(storedNet*1.27);\n  const items=Array.isArray(q?.items)?q.items:[];\n  const net=items.reduce((sum,x)=>sum+(Number(x?.qty)||0)*(Number(x?.price)||0),0);\n  return Math.round(net*1.27);\n}\n`;
          if(!s.includes('function quoteDisplayGross(q)')){
            const anchor='function quoteRows(arr=db.quotes){';
            const pos=s.indexOf(anchor);
            if(pos<0) throw Error('quoteRows anchor missing');
            s=s.slice(0,pos)+helper+s.slice(pos);
          }
          const start=s.indexOf('function quoteRows(arr=db.quotes){');
          if(start<0) throw Error('quoteRows start missing');
          const next=s.indexOf('\nfunction ',start+10);
          if(next<0) throw Error('quoteRows end anchor missing');
          const replacement=`function quoteRows(arr=db.quotes){\n const statuses=["Piszkozat","Elkészítve","Elküldve","Tárgyalás alatt","Elfogadva","Elutasítva","Lezárva"];\n return \`<div class="tablewrap"><table class="table"><thead><tr><th>Ajánlat</th><th>Ügyfél</th><th>Helyszín</th><th>Bruttó</th><th>Státusz</th><th></th></tr></thead><tbody>\${arr.map(q=>{const displayGross=quoteDisplayGross(q);return \`<tr>\n <td><a href="#" class="link" data-quote-id="\${q.id}" onclick="openQuotePage('\\${q.id}');return false" title="Árajánlat megnyitása"><b>\${q.id}</b></a><br><span class="label">\${esc(q.name)}</span></td>\n <td>\${esc(cust(q.customerId))}</td><td>\${esc(q.location)}</td><td>\${money(displayGross)}</td>\n <td><select class="quote-status-pill quote-status-\${statusClass(q.status)}" onchange="changeQuoteStatus('\\${q.id}',this.value)" aria-label="Státusz">\${statuses.map(st=>\`<option value="\${esc(st)}" \${q.status===st?'selected':''}>\${esc(st)}</option>\`).join("")}</select></td>\n <td style="white-space:nowrap">\n   <div style="display:flex;gap:6px;align-items:center;justify-content:flex-end">\n    <button class="btn secondary small" onclick="openQuoteEditorPage('\\${q.id}');return false;">Megnyitás</button>\n    \${q.status==="Elfogadva"?\`<button class="btn small" onclick="convertQuote('\\${q.id}')">→ Projekt</button>\`:""}\n   </div>\n </td>\n</tr>\`;}).join("")}\</tbody></table></div>\`;\n}`;
          s=s.slice(0,start)+replacement+s.slice(next);
          const old='const total=qs.reduce((a,q)=>a+(Number(q.gross)||0),0);';
          const neu='const total=qs.reduce((a,q)=>a+quoteDisplayGross(q),0);';
          if(s.includes(old)) s=s.replace(old,neu);
          else if(!s.includes(neu)) throw Error('quotes total anchor missing');
          await put('all.js',f.sha,s,'fix: quote list display totals');
          console.log('quote list display totals patched');
          NODE
