name: Fix mobile JS render

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair malformed script tag and mobile worklog layout
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          bad='''document.addEventListener("click",function(e){\n const a=e.target.closest("[data-quote-id]");\n if(a){e.preventDefault();editQuote(a.getAttribute("data-quote-id"))}\n});/* data-quote-edit-fallback */\n<script src="quote_template.js">\nfunction pipe3mParts(length){\n  const m=Math.max(0,Math.floor(Number(length)||0));\n  const db=Math.floor(m/3);\n  const maradek=m%3;\n  return maradek ? `${db} db + ${maradek} m` : `${db} db`;\n}\n</script>'''
          good='''<script src="quote_template.js"></script>\n<script>\nfunction pipe3mParts(length){\n  const m=Math.max(0,Math.floor(Number(length)||0));\n  const db=Math.floor(m/3);\n  const maradek=m%3;\n  return maradek ? `${db} db + ${maradek} m` : `${db} db`;\n}\n</script>'''
          if bad in s:
              s=s.replace(bad,good,1)
          else:
              # Fallback: remove the stray listener only if it appears before quote_template.js.
              start=s.find('document.addEventListener("click",function(e){')
              script=s.find('<script src="quote_template.js">')
              if 0<=start<script:
                  end=s.find('});/* data-quote-edit-fallback */',start)
                  if end!=-1:
                      s=s[:start]+s[end+len('});/* data-quote-edit-fallback */'):]
                  s=s.replace('<script src="quote_template.js">','<script src="quote_template.js"></script><script>',1)
                  marker='function pipe3mParts(length){'
                  if marker in s and s.find(marker)>s.find('<script>',s.find('quote_template.js')):
                      close=s.find('</script>',s.find(marker))
                      if close!=-1:
                          s=s[:close]+'</script>'+s[close+len('</script>'):]
          # Keep the worklog list usable on iPhone: horizontal scroll stays inside the table, not the page.
          mobile='''\n@media(max-width:600px){#worklogTable{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}#worklogTable .table{min-width:650px}#worklogTable .tablewrap{width:100%;overflow-x:auto;overscroll-behavior-x:contain}.wl-shell{max-width:100%;overflow-x:hidden}}\n'''
          s=s.replace('</style>\n<style id="worklog-template-css">',mobile+'</style>\n<style id="worklog-template-css">',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/fix-mobile-js-render.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Munkanapló mobil javítás és nyers JS eltávolítása"
          git push
