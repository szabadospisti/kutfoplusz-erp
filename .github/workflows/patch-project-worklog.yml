name: Add project to worklog

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-project-worklog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch original worklog editor safely
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '<!-- KP_DIRECT_PROJECT_WORKLOG_V1 -->' in s:
              print('Direct project-worklog patch already embedded.')
              raise SystemExit(0)

          replacements = [
            (
              'function newWorklogFor(pid){openWorklogEditor()}',
              'function newWorklogFor(pid){window.__kpPendingWorklogProjectId=pid||"";openWorklogEditor()}'
            ),
            (
              'function detailedWorklogEditor(id){',
              'function detailedWorklogEditor(id,projectId){'
            ),
            (
              ' const w=id?db.worklogs.find(x=>x.id===id):null;',
              ' const w=id?db.worklogs.find(x=>x.id===id):null;\n const selectedProjectId=projectId||w?.projectId||window.__kpPendingWorklogProjectId||"";'
            ),
            (
              ' <div class="wl-field"><label>Megrendelő</label><select id="wl_client"><option value="">— Válassz —</option>${custOpts}</select></div>\n <div class="wl-field"><label>Kút sorszáma</label>',
              ' <div class="wl-field"><label>Megrendelő</label><select id="wl_client"><option value="">— Válassz —</option>${custOpts}</select></div>\n <div class="wl-field"><label>Projekt</label><select id="wl_project"><option value="">— Válassz —</option>${projOpts}</select></div>\n <div class="wl-field"><label>Kút sorszáma</label>'
            ),
            (
              'const projOpts=db.projects.map(p=>`<option value="${p.id}" ${p.id===w?.projectId?"selected":""}>${esc(p.id)} – ${esc(p.name)}</option>`).join("");',
              'const projOpts=db.projects.map(p=>`<option value="${p.id}" ${p.id===selectedProjectId?"selected":""}>${esc(p.id)} – ${esc(p.name)}</option>`).join("");'
            ),
            (
              'projectId:document.querySelector("#wlForm select:not(#wl_client)")?.value||"",',
              'projectId:document.getElementById("wl_project")?.value||"",'
            )
          ]

          for old,new in replacements:
              if old not in s:
                  raise SystemExit('SAFE PATCH FAILED: target not found; index.html was NOT changed: '+old[:120])
              s=s.replace(old,new,1)

          marker='''<!-- KP_DIRECT_PROJECT_WORKLOG_V1 -->\n<script>\n(function(){\n  if(window.__KP_DIRECT_PROJECT_WORKLOG_V1__) return;\n  window.__KP_DIRECT_PROJECT_WORKLOG_V1__=true;\n  var original=window.newWorklogFor;\n  if(typeof original!=="function") return;\n  window.newWorklogFor=function(pid){\n    window.__kpPendingWorklogProjectId=pid||"";\n    return original.call(this,pid);\n  };\n})();\n</script>\n'''
          pos=s.rfind('</body>')
          if pos<0:
              raise SystemExit('SAFE PATCH FAILED: </body> not found; index.html was NOT changed')
          s=s[:pos]+marker+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Direct worklog project patch embedded successfully.')
          PY

      - name: Commit patched index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix project selection directly in worklog editor'
          git push
