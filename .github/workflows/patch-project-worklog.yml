name: Fix project and customer preselection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-project-worklog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply safe project preselection patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- KP_PROJECT_PRESELECT_V2 -->'
          if marker in s:
              print('Patch already embedded')
              raise SystemExit(0)

          # Keep the existing field if the earlier bridge created it.
          # Also patch the real project-launch function so the project id is retained.
          old_variants = [
              'function newWorklogFor(pid){openWorklogEditor()}',
              'function newWorklogFor(pid){window.__kpPendingWorklogProjectId=pid||"";openWorklogEditor()}'
          ]
          new='function newWorklogFor(pid){window.__kpPendingWorklogProjectId=pid||"";openWorklogEditor();setTimeout(function(){window.__KP_PRESELECT_WORKLOG__(pid)},0)}'
          found=False
          for old in old_variants:
              if old in s:
                  s=s.replace(old,new,1)
                  found=True
                  break
          if not found:
              raise SystemExit('SAFE PATCH FAILED: newWorklogFor target not found; index.html unchanged')

          script='''<!-- KP_PROJECT_PRESELECT_V2 -->
          <script>
          (function(){
            function preselect(pid){
              var projectId=pid||window.__kpPendingWorklogProjectId||'';
              if(!projectId) return;
              var select=document.getElementById('wl_project');
              if(!select) return;
              select.value=String(projectId);
              select.dispatchEvent(new Event('change',{bubbles:true}));
              var projects=(window.db&&Array.isArray(window.db.projects))?window.db.projects:[];
              var p=projects.find(function(x){return String(x.id)===String(projectId)});
              if(!p) return;
              var client=document.getElementById('wl_client');
              if(client && p.customerId){
                client.value=String(p.customerId);
                client.dispatchEvent(new Event('change',{bubbles:true}));
              }
              var loc=document.getElementById('wl_location');
              if(loc && p.location && !loc.value) loc.value=p.location;
            }
            window.__KP_PRESELECT_WORKLOG__=preselect;
          })();
          </script>
          '''
          pos=s.rfind('</body>')
          if pos<0:
              raise SystemExit('SAFE PATCH FAILED: </body> not found; index.html unchanged')
          s=s[:pos]+script+'\n'+s[pos:]
          p.write_text(s,encoding='utf-8')
          print('Project/customer preselection patch applied')
          PY

      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Preselect project and customer in worklog'
          git push
