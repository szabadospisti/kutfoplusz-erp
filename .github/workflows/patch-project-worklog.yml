name: Fix project and customer preselection

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-project-worklog.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix project data access in worklog bridge
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old1="var projects=(window.db&&Array.isArray(window.db.projects))?window.db.projects:[];"
          new1="var projects=(typeof db!=='undefined'&&db&&Array.isArray(db.projects))?db.projects:[];"
          old2="var projects=(window.db&&Array.isArray(window.db.projects))?window.db.projects:[];"
          changed=False
          if old1 in s:
              s=s.replace(old1,new1)
              changed=True
          elif old2 in s:
              s=s.replace(old2,new1)
              changed=True
          if not changed:
              print('No window.db project access found; nothing to change')
          else:
              p.write_text(s,encoding='utf-8')
              print('Fixed project data access: use lexical db binding')
          PY

      - name: Commit index.html
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix project data access in worklog bridge'
          git push
