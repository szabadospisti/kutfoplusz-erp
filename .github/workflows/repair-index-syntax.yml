name: Repair index syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-fix-index]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install isolated authentication core
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="auth-core.js"></script>'
          anchor = '<script src="supabase_config.js"></script>'
          if tag not in s:
              if anchor not in s:
                  raise SystemExit('Supabase config anchor not found')
              s = s.replace(anchor, anchor + tag, 1)
              p.write_text(s, encoding='utf-8')
              print('Installed isolated auth core before main ERP script.')
          else:
              print('Auth core already installed.')

      - name: Repair malformed JavaScript regex literals
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find(' const bullets=t=>')
          marker = ' return `<div class="quote-doc">'
          if start >= 0:
              end = s.find(marker, start)
              if end >= 0:
                  bs = chr(92)
                  nl = chr(10)
                  replacement = (
                      ' const bullets=t=>String(t||"").split(/' + bs + 'r?' + bs + 'n/).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");' + nl +
                      ' const declarations=esc(q.declarations||"").replace(/' + bs + 'n/g,"<br><br>");' + nl
                  )
                  s = s[:start] + replacement + s[end:]
                  p.write_text(s, encoding='utf-8')
                  print('Regex repair applied safely.')
              else:
                  print('Quote document marker not found; leaving source unchanged.')
          else:
              print('Quote bullets block not found; leaving source unchanged.')

      - name: Guard main auth functions behind isolated core
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          login = 'async function supabaseLogin(e){'
          guarded_login = 'async function supabaseLogin(e){ if(window.__KP_AUTH_CORE__) return window.__KP_AUTH_LOGIN__(e);'
          if login in s and guarded_login not in s:
              s = s.replace(login, guarded_login, 1)
          boot = 'async function bootERP(){'
          guarded_boot = 'async function bootERP(){ if(window.__KP_AUTH_CORE__) return;'
          if boot in s and guarded_boot not in s:
              s = s.replace(boot, guarded_boot, 1)
          p.write_text(s, encoding='utf-8')
          print('Main login and boot are delegated to isolated auth core.')

      - name: Commit protected login bootstrap
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html auth-core.js
          if git diff --cached --quiet; then
            echo 'No source repair needed.'
            exit 0
          fi
          git commit -m '[auto-fix-index] Protect login from module syntax errors'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Verify inline JavaScript syntax
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess
          s = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)</script>', s, re.I)
          if not blocks:
              raise SystemExit('No inline JavaScript blocks found')
          failed = False
          for i, code in enumerate(blocks, 1):
              path = Path(f'/tmp/erp-inline-{i}.js')
              path.write_text(code, encoding='utf-8')
              result = subprocess.run(['node', '--check', str(path)], text=True, capture_output=True)
              if result.returncode:
                  failed = True
                  print(f'INLINE_SCRIPT_{i}_SYNTAX_ERROR')
                  print(result.stdout)
                  print(result.stderr)
          if failed:
              raise SystemExit(1)
          print(f'OK: {len(blocks)} inline JavaScript blocks passed node --check')
