name: Apply Permit Technical Import Fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[permit-tech-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Patch permit technical persistence
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          anchor = '''        pressurePipe:f.pressurePipe,\n        distributionPipe:f.distributionPipe\n      },'''
          replacement = '''        pressurePipe:f.pressurePipe,\n        distributionPipe:f.distributionPipe,\n        // A létesítési engedélyből felismert műszaki szakaszok tartósan\n        // kerüljenek a projekthez is, ne csak az ajánlat pillanatnyi tech tömbjébe.\n        casingSections:(()=>{\n          const depth=String(f.plannedDepth||f.wellDepth||\"\").replace(\",\",\".\");\n          const steel=String(f.steelPipe||\"\").trim();\n          const casing=String(f.casingDiameter||\"\").trim();\n          const screen=String(f.screenInterval||\"\").trim().match(/([0-9]+(?:[.,][0-9]+)?)\\s*[–-]\\s*([0-9]+(?:[.,][0-9]+)?)/);\n          const out=[];\n          if(steel) out.push({type:\"Acél iránycső\",from:\"0\",to:String((Array.isArray(f.pipeSections)?f.pipeSections:[]).find(x=>/acél/i.test(String(x?.spec||\"\")))?.to||\"6\"),len:String((Array.isArray(f.pipeSections)?f.pipeSections:[]).find(x=>/acél/i.test(String(x?.spec||\"\")))?.len||\"6\"),diameter:steel,material:\"acél\"});\n          if(casing && depth) out.push({type:\"Cső\",from:\"0\",to:depth,len:depth,diameter:casing,material:/PVC/i.test(casing)?\"PVC\":\"\"});\n          if(screen) out.push({type:\"Szűrő\",from:screen[1].replace(\",\",\".\"),to:screen[2].replace(\",\",\".\"),len:String(Number(screen[2].replace(\",\",\".\"))-Number(screen[1].replace(\",\",\".\"))),diameter:String(f.filterDiameter||casing),material:/PVC/i.test(String(f.filterDiameter||casing))?\"PVC\":\"\"});\n          return out;\n        })()\n      },'''
          changed = 0
          for name in ['index.html','all.js']:
              p=Path(name); s=p.read_text(encoding='utf-8')
              n=s.count(anchor)
              if n != 1:
                  raise SystemExit(f'{name}: expected 1 anchor, found {n}')
              s=s.replace(anchor,replacement,1)
              p.write_text(s,encoding='utf-8')
              changed += 1
          print(f'patched {changed} files')
          PY
          node --check all.js
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-permit-tech-fix.yml
          git add index.html all.js
          git commit -m '[permit-tech-fix] persist permit casing and filter sections'
          git push origin HEAD:main
