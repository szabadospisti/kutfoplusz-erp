name: Fix native quote recalculation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[native-quote-recalc]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch native quote recalculation
        shell: python
        run: |
          from pathlib import Path
          import re

          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          original=text

          recalc=re.compile(r'''const autoDesc=`\$\{count\}\s*db\s*\$\{depthText\?depthText\+" m-es ":""\}\$\{wellWord\} kivitelezése`;\s*const looksAuto=.*?quoteItems\[0\]\.desc=autoDesc;\s*quoteItems\[0\]\.qty=1;\s*quoteItems\[0\]\.unit="db";\s*quoteItems\[0\]\.price=depth>0 && meterRate>0 \? depth\*meterRate : 0;''', re.S)
          new_recalc='''const autoDesc=`${depthText?depthText+" m-es ":""}${wellWord} kivitelezése`;
          const looksAuto=!current || /^\\d+\\s*db\\s+.*(?:öntözőkút|kút)\\s+kivitelezése$/i.test(current);
          if(looksAuto) quoteItems[0].desc=autoDesc;
          quoteItems[0].qty=count>0 ? count : 1;
          quoteItems[0].unit="db";
          if(!quoteItems[0].priceManual) quoteItems[0].price=depth>0 && meterRate>0 ? depth*meterRate : 0;'''
          text,n=recalc.subn(new_recalc,text,count=1)
          if n!=1: raise SystemExit(f'native recalc match={n}, expected 1')

          project=re.compile(r'''const mainDesc=`\$\{count\}\s*db\s*\$\{depth\?String\(depth\)\.replace\("\.\",\",\"\)\+" m-es ":""\}\$\{wellWord\} kivitelezése`;\s*if\(Array\.isArray\(quoteItems\) && quoteItems\.length\)\{\s*const current=.*?const looksAuto=.*?if\(looksAuto\)\{ quoteItems\[0\]\.desc=mainDesc; quoteItems\[0\]\.qty=1; quoteItems\[0\]\.unit="db"; \}\s*\}''',re.S)
          new_project='''const mainDesc=`${depth?String(depth).replace(".",",")+" m-es ":""}${wellWord} kivitelezése`;
          if(Array.isArray(quoteItems) && quoteItems.length){
            const current=String(quoteItems[0]?.desc||"").trim();
            const looksAuto=!current || /^\\d+\\s*db\\s+.*(?:öntözőkút|kút)\\s+kivitelezése$/i.test(current);
            if(looksAuto){ quoteItems[0].desc=mainDesc; quoteItems[0].qty=count>0 ? count : 1; quoteItems[0].unit="db"; }
          }'''
          text,n2=project.subn(new_project,text,count=1)
          if n2!=1: raise SystemExit(f'project-change match={n2}, expected 1')

          if text==original: raise SystemExit('No source change')
          if 'quoteItems[0].qty=1;' in text: raise SystemExit('old native qty=1 assignment remains')
          if 'if(!quoteItems[0].priceManual)' not in text: raise SystemExit('manual-price guard missing')
          p.write_text(text,encoding='utf-8')

      - name: Validate
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess, tempfile
          html=Path('index.html').read_text(encoding='utf-8')
          assert not re.search(r'quote_preview_(?:pages|vectors)\.js',html,re.I)
          assert len(re.findall(r'quote_ui_fix\.js',html,re.I))==1
          assert 'quoteItems[0].qty=count>0 ? count : 1;' in html
          assert 'if(!quoteItems[0].priceManual)' in html
          blocks=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.I|re.S)
          with tempfile.TemporaryDirectory() as td:
              for i,b in enumerate(blocks,1):
                  f=Path(td)/f'inline_{i}.js';f.write_text(b,encoding='utf-8')
                  r=subprocess.run(['node','--check',str(f)],text=True,capture_output=True)
                  if r.returncode: raise SystemExit(f'inline {i} syntax error:\n{r.stderr}')

      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm -f .github/workflows/fix-native-quote-recalc.yml
          git commit -m "Fix native quote quantity and manual price recalculation [native-quote-recalc]"
          git push origin HEAD:main
