name: finalize quote editor fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply quote editor fix and restore original preview payload
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old_project='const projectOptions=(db.projects||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name)}</option>`).join("");'
          new_project='const projectOptions=(db.projects||[]).filter(p=>!customerId||String(p.customerId||p.clientId||"")===String(customerId)).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name)}</option>`).join("");'
          if old_project not in s:
              raise SystemExit('projectOptions target not found; refusing unsafe patch')
          s=s.replace(old_project,new_project,1)

          old_diameter='<div><label>Béléscső átmérő (mm)</label><input id="q_pipe_diameter" class="input" type="text" readonly title="A kapcsolt projektből érkező átmérő"></div>'
          new_diameter='''<div><label>Béléscső átmérő (mm)</label><select id="q_pipe_diameter" class="input" onchange="quoteDiameterChanged()"><option value="">— Válassz átmérőt —</option>${(Array.isArray(db.drillingPriceList)?db.drillingPriceList:[]).filter(x=>String(x?.diameter??"").trim()).map(x=>`<option value="${esc(x.diameter)}">Ø ${esc(x.diameter)} mm</option>`).join("")}</select></div>'''
          if old_diameter not in s:
              raise SystemExit('diameter input target not found; refusing unsafe patch')
          s=s.replace(old_diameter,new_diameter,1)

          marker='function recalculateQuoteMainItem(doRender=true){'
          if marker not in s:
              raise SystemExit('recalculateQuoteMainItem marker not found')
          diameter_fn='''function quoteDiameterChanged(){
 const el=document.getElementById("q_pipe_diameter");
 if(!el)return;
 const value=String(el.value||"").trim();
 recalculateQuoteMainItem(false);
 renderQuoteEditor();
 const after=document.getElementById("q_pipe_diameter");
 if(after&&value)after.value=value;
}
'''
          if 'function quoteDiameterChanged(){' not in s:
              s=s.replace(marker,diameter_fn+'\n'+marker,1)

          customer_marker='''function quoteCustomerChanged(){'''
          if customer_marker not in s:
              raise SystemExit('quoteCustomerChanged marker not found')
          filter_fn='''function filterQuoteProjectsForCustomer(){
 const ce=document.getElementById("q_customer");
 const pe=document.getElementById("q_project");
 if(!pe)return;
 const customerId=String(ce?.value||"").trim();
 const current=String(pe.value||"").trim();
 const projects=(db.projects||[]).filter(p=>!customerId||String(p.customerId||p.clientId||"")===customerId);
 const valid=current&&projects.some(p=>String(p.id)===current);
 pe.innerHTML=`<option value="">— Válassz projektet —</option>`+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name||"")}</option>`).join("");
 pe.value=valid?current:"";
 if(!valid&&current){
   recalculateQuoteMainItem(false);
   renderQuoteEditor();
 }
}
'''
          if 'function filterQuoteProjectsForCustomer(){' not in s:
              s=s.replace(customer_marker,filter_fn+'\n'+customer_marker,1)

          start=s.index('function quoteCustomerChanged(){')
          end=s.index('\n}\nfunction quoteProjectChanged(){',start)+2
          block=s[start:end]
          if 'filterQuoteProjectsForCustomer();' not in block:
              block=block[:-2]+'\n filterQuoteProjectsForCustomer();\n}'
              s=s[:start]+block+s[end:]

          p.write_text(s,encoding='utf-8')
          PY
          git show acc20abf63d707a2bc7a09aadcd38363478bdb1a:quote_preview_pages.js > quote_preview_pages.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/erp.js').write_text(js,encoding='utf-8')
          assert 'function quoteDiameterChanged(){' in s
          assert 'filterQuoteProjectsForCustomer' in s
          assert '<select id="q_pipe_diameter"' in s
          PY
          node --check /tmp/erp.js
          node --check quote_preview_pages.js
          git diff --check
      - name: Commit final source and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html quote_preview_pages.js
          git rm .github/workflows/finalize-quote-editor-fix.yml
          git commit -m "fix: finalize quote editor project and diameter flow"
          git push
