name: Install ERP system workflow
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, '[system-nav-installed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install static Rendszer navigation
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          nav='<button class="nav" data-page="reports"><i>◔</i>Riportok</button>'
          if 'id="system-workflow-nav"' not in s:
              if nav not in s: raise SystemExit('ERROR: Riportok sidebar button not found')
              s=s.replace(nav,nav+'\n    <button class="nav" id="system-workflow-nav" type="button"><i>⚙</i>Rendszer</button>',1)
          s=s.replace('<script src="system-workflow.js"></script>','')
          if '</body>' not in s: raise SystemExit('ERROR: final body tag missing')
          parts=s.rsplit('</body>',1)
          s=parts[0]+'<script src="system-workflow.js"></script>\n</body>'+parts[1]
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: python
        run: |
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('id="system-workflow-nav"')==1
          assert s.count('src="system-workflow.js"')==1
          print('OK: static Rendszer navigation and final-body script installed')
      - name: Commit installation
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Fix Rendszer Workflow script placement [system-nav-installed]'
          git pull --rebase origin main
          git push origin HEAD:main
