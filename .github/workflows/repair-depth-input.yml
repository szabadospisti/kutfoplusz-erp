name: repair depth input
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch depth input
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("index.html"); s=p.read_text(encoding="utf-8"); old="""function huFormatInput(el,decimals=1){\n  if(!el) return;\n  const raw=String(el.value??\"\");\n  if(!raw.trim()){el.value=\"\";return;}\n  const n=huNumber(raw);\n  if(!Number.isFinite(n)) return;\n  el.value=n.toLocaleString(\"hu-HU\",{minimumFractionDigits:decimals,maximumFractionDigits:decimals});\n}"""; new="""function huFormatInput(el,decimals=1){\n  if(!el) return;\n  const raw=String(el.value??\"\");\n  if(!raw.trim()) return;\n  const start=typeof el.selectionStart===\"number\"?el.selectionStart:null;\n  const before=start==null?raw:raw.slice(0,start);\n  const normalized=raw.replace(/\\\\./g,\",\").replace(/[^0-9,\\\\-]/g,\"\");\n  if(normalized===raw) return;\n  const normalizedBefore=before.replace(/\\\\./g,\",\").replace(/[^0-9,\\\\-]/g,\"\");\n  el.value=normalized;\n  if(start!=null){const pos=Math.min(normalized.length,normalizedBefore.length);try{el.setSelectionRange(pos,pos)}catch(e){}}\n}"""; assert old in s; s=s.replace(old,new,1); old2="<input id=\"q_depth\" class=\"input\" type=\"text\" inputmode=\"decimal\" oninput=\"huFormatInput(this,1)\" onchange=\"recalculateQuoteMainItem()\">"; new2="<input id=\"q_depth\" class=\"input\" type=\"text\" inputmode=\"decimal\" oninput=\"huFormatInput(this,1)\" onchange=\"huFormatInput(this,1);recalculateQuoteMainItem()\" onblur=\"huFormatInput(this,1)\">"; assert old2 in s; s=s.replace(old2,new2,1); p.write_text(s,encoding="utf-8")'
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          js='\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S))
          Path('/tmp/erp.js').write_text(js,encoding='utf-8')
          PY
          node --check /tmp/erp.js
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "fix: preserve depth input cursor"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          git rm .github/workflows/repair-depth-input.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
