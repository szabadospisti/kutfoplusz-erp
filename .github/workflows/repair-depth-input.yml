name: repair depth input
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch depth input handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''function huFormatInput(el,decimals=1){
  if(!el) return;
  const raw=String(el.value??"");
  if(!raw.trim()){el.value="";return;}
  const n=huNumber(raw);
  if(!Number.isFinite(n)) return;
  el.value=n.toLocaleString("hu-HU",{minimumFractionDigits:decimals,maximumFractionDigits:decimals});
}'''
          new = '''function huFormatInput(el,decimals=1){
  if(!el) return;
  const raw=String(el.value??"");
  if(!raw.trim()){return;}
  // Ne formázzunk újra minden billentyűleütésnél: a DOM value átírása
  // elveszíti a kurzor pozícióját (pl. 50 → 5,0 után az új számjegy
  // a tizedesjel mögé kerül). Bevitel közben csak normalizálunk;
  // a teljes formázás blur/change esetén történik.
  const start=typeof el.selectionStart==="number"?el.selectionStart:null;
  const before=start==null?raw:raw.slice(0,start);
  const normalized=raw.replace(/\\./g,",").replace(/[^0-9,\\-]/g,"");
  if(normalized===raw) return;
  const normalizedBefore=before.replace(/\\./g,",").replace(/[^0-9,\\-]/g,"");
  el.value=normalized;
  if(start!=null){
    const pos=Math.min(normalized.length,normalizedBefore.length);
    try{el.setSelectionRange(pos,pos);}catch(_e){}
  }
}'''
          if old not in s:
              raise SystemExit('huFormatInput block not found; refusing unsafe patch')
          s = s.replace(old, new, 1)
          old2 = '<input id="q_depth" class="input" type="text" inputmode="decimal" oninput="huFormatInput(this,1)" onchange="recalculateQuoteMainItem()">'
          new2 = '<input id="q_depth" class="input" type="text" inputmode="decimal" oninput="huFormatInput(this,1)" onchange="huFormatInput(this,1);recalculateQuoteMainItem()" onblur="huFormatInput(this,1)">'
          if old2 not in s:
              raise SystemExit('q_depth input not found; refusing unsafe patch')
          s = s.replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          print('patched index.html')
          PY
          node --check <(python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          print('\n'.join(re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)))
          PY
          )
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git commit -m "fix: preserve depth input cursor"
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/repair-depth-input.yml
          git add -u .github/workflows/repair-depth-input.yml
          git commit -m "chore: remove temporary repair workflow"
          git push
