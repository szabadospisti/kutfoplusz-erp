name: repair-quote
on:
  push:
    paths:
      - '.github/workflows/repair-quote.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix project diameter fallback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='const diameter=casing || w.diameter || w.drillingDiameter || p.diameter || "";'
          new='const diameter=casing || w.diameter || w.drillingDiameter || p.diameter || drillingDiameterFromText(p.name||p.quoteTitle||"") || "";'
          if old not in s:
              raise SystemExit('quote diameter source not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          open('/tmp/index.js','w',encoding='utf-8').write(js)
          PY
          node --check /tmp/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: derive quote diameter from project name'
          git push
