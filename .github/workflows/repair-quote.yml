name: repair-quote
on:
  push:
    paths:
      - '.github/workflows/repair-quote.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace(' const projectOptions=(db.projects||[]).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name)}</option>`).join("");',' const selectedCustomerId=String(customerId||"");\n const projectOptions=(db.projects||[]).filter(p=>!selectedCustomerId || String(p.customerId||"")===selectedCustomerId).map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name)}</option>`).join("");',1)
          old='function quoteCustomerChanged(){\n const id=document.getElementById("q_customer").value,c=(db.customers||[]).find(x=>x.id===id);if(!c)return;\n ["name","address","tax","phone","email"].forEach(k=>{const el=document.getElementById("q_client_"+k);if(el)el.value=c[k]||""});\n}'
          new='function quoteCustomerChanged(){\n const id=String(document.getElementById("q_customer")?.value||"");\n const c=(db.customers||[]).find(x=>String(x.id)===id);\n if(c)["name","address","tax","phone","email"].forEach(k=>{const el=document.getElementById("q_client_"+k);if(el)el.value=c[k]||""});\n const pe=document.getElementById("q_project");\n if(pe){\n   const current=String(pe.value||"");\n   const projects=(db.projects||[]).filter(p=>!id || String(p.customerId||"")===id);\n   pe.innerHTML=`<option value="">— Válassz projektet —</option>`+projects.map(p=>`<option value="${esc(p.id)}">${esc(p.id)} – ${esc(p.name)}</option>`).join("");\n   if(projects.some(p=>String(p.id)===current)) pe.value=current;\n   else pe.value="";\n }\n}'
          if old in s: s=s.replace(old,new,1)
          marker='function recalculateQuoteMainItem(doRender=true){'
          i=s.index(marker)
          target=' const meterRate=drillingPriceForDiameter(diameter);'
          j=s.index(target,i)
          repl=' const projectId=document.getElementById("q_project")?.value||"";\n const project=(db.projects||[]).find(x=>String(x.id)===String(projectId));\n const isUndocumented=String(project?.projectType||"").toLowerCase()==="undocumented" || project?.isUndocumented===true || project?.documentationRequired===false;\n const meterRate=isUndocumented ? undocumentedDrillingPriceForDiameter(diameter) : drillingPriceForDiameter(diameter);'
          s=s[:j]+s[j:].replace(target,repl,1)
          dup=' const projectId=document.getElementById("q_project")?.value||"";\n const project=(db.projects||[]).find(x=>String(x.id)===String(projectId));\n const purpose=String(project?.well?.purpose||project?.purpose||document.getElementById("q_purpose")?.value||document.getElementById("q_subject")?.value||"");'
          s=s.replace(dup,' const purpose=String(project?.well?.purpose||project?.purpose||document.getElementById("q_purpose")?.value||document.getElementById("q_subject")?.value||"");',1)
          p.write_text(s,encoding='utf-8')
          PY
          python3 - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I))
          open('/tmp/index.js','w',encoding='utf-8').write(js)
          PY
          node --check /tmp/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then git commit -m 'fix: quote customer filtering and undocumented pricing'; git push; fi
