name: Quote List Diagnostic
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
      - name: Enforce canonical quote number format
        if: ${{ !contains(github.event.head_commit.message, 'fix: enforce A-YY-NNN quote format') }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='return `A-${yy}${String(nextDocumentSequence()).padStart(3,"0")}`;'
          new='return `A-${yy}-${String(nextDocumentSequence()).padStart(3,"0")}`;'
          if old in s:
              p.write_text(s.replace(old,new,1),encoding='utf-8')
          elif new not in s:
              raise SystemExit('nextQuoteId format not found')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'fix: enforce A-YY-NNN quote format'
            git push
          fi
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.62.0 >/dev/null 2>&1
          npx playwright install chromium --with-deps >/dev/null 2>&1
      - name: Inspect quote list runtime
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/erp-http.log 2>&1 &
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage();
            page.on('pageerror',e=>console.log('PAGEERROR',String(e&&e.stack||e)));
            await page.goto('http://127.0.0.1:4173/index.html',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForTimeout(1500);
            const before=await page.evaluate(()=>Object.keys(window).filter(k=>/quote|offer|aj[aá]nlat|render/i.test(k)).sort());
            console.log('WINDOW_FUNCTIONS',before.join('\n'));
            await page.evaluate(()=>window.nav('quotes'));
            await page.waitForTimeout(500);
            const out=await page.evaluate(()=>({hash:location.hash,html:document.getElementById('content')?.innerHTML||'',text:document.getElementById('content')?.textContent||'',functions:Object.keys(window).filter(k=>/quote|offer|aj[aá]nlat|render/i.test(k)&&typeof window[k]==='function').sort()}));
            console.log('HASH',out.hash);
            console.log('FUNCTIONS',out.functions.join('\n'));
            console.log('HTML_START',out.html.slice(0,30000));
            console.log('TEXT_START',out.text.slice(0,10000));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
