name: Apply quote price fix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quote pricing
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = ''' const depth=huNumber(depthRaw);\n const diameter=String(diameterRaw).trim();\n const meterRate=drillingPriceForDiameter(diameter);\n if(!Array.isArray(quoteItems)) quoteItems=[];\n if(!quoteItems.length) quoteItems.push({desc:"",qty:1,unit:"db",price:0});\n const current=String(quoteItems[0].desc||"");\n const projectId=document.getElementById("q_project")?.value||"";\n const project=(db.projects||[]).find(x=>String(x.id)===String(projectId));\n'''
          new = ''' const depth=huNumber(depthRaw);\n const diameter=String(diameterRaw).trim();\n if(!Array.isArray(quoteItems)) quoteItems=[];\n if(!quoteItems.length) quoteItems.push({desc:"",qty:1,unit:"db",price:0});\n const current=String(quoteItems[0].desc||"");\n const projectId=document.getElementById("q_project")?.value||"";\n const project=(db.projects||[]).find(x=>String(x.id)===String(projectId));\n const isUndocumented=String(project?.projectType||"official")==="undocumented";\n const meterRate=isUndocumented\n   ? undocumentedDrillingPriceForDiameter(diameter)\n   : drillingPriceForDiameter(diameter);\n'''
          if old in s:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          elif 'const isUndocumented=String(project?.projectType||"official")==="undocumented";' in s:
              print('Already patched')
          else:
              raise SystemExit('Expected quote pricing block not found')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: use undocumented drilling price in quotes"
          git push