name: Ensure machine fleet loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ensure-loader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject machine fleet script
        shell: bash
        run: |
          set -e
          if ! grep -q 'machine-fleet-final.js' index.html; then
            python3 - <<'PY'
from pathlib import Path
p = Path('index.html')
s = p.read_text(encoding='utf-8')
marker = '</body>'
script = '<script src="machine-fleet-final.js?v=1"></script>\n'
if 'machine-fleet-final.js' not in s:
    s = s.replace(marker, script + marker, 1)
    p.write_text(s, encoding='utf-8')
PY
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html
            git commit -m 'Load final machine fleet module'
            git push
          else
            echo 'Machine fleet loader already present.'
          fi
