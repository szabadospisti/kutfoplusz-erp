name: Hotfix broken inline ERP JavaScript

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-syntax-hotfix.yml'

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Repair only known broken inline JavaScript
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          changed = False

          # The old automatic repair could leave the quote bullet regex split
          # across a real newline. Replace that whole tiny block safely.
          start = s.find(' const bullets=t=>')
          marker = ' return `<div class="quote-doc">'
          if start >= 0:
              end = s.find(marker, start)
              if end >= 0:
                  bs = chr(92)
                  replacement = (
                      ' const bullets=t=>String(t||"").split(/' + bs + 'r?' + bs + 'n/).filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join("");\n'
                      ' const declarations=esc(q.declarations||"").replace(/' + bs + 'n/g,"<br><br>");\n'
                  )
                  current = s[start:end]
                  if current != replacement:
                      s = s[:start] + replacement + s[end:]
                      changed = True

          # A literal </script> inside a JavaScript string terminates the HTML
          # script element. Escape only the known print-template occurrence.
          old = "window.print('</script></body></html>')"
          new = "window.print('<\\/script></body></html>')"
          if old in s:
              s = s.replace(old, new, 1)
              changed = True

          p.write_text(s, encoding='utf-8')
          print('Runtime syntax hotfix changed source:', changed)

      - name: Verify repaired source
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          page = Path('index.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\\bsrc=)[^>]*>([\\s\\S]*?)</script>', page, re.I)
          failed = False
          for i, code in enumerate(blocks, 1):
              path = Path(f'/tmp/hotfix-{i}.js')
              path.write_text(code, encoding='utf-8')
              r = subprocess.run(['node', '--check', str(path)], text=True, capture_output=True)
              if r.returncode:
                  failed = True
                  print(f'INLINE_JS_SYNTAX_ERROR: block {i}')
                  print(r.stderr)
          if failed:
              raise SystemExit(1)
          print(f'OK: {len(blocks)} inline blocks pass syntax check')

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Repair broken inline ERP JavaScript'
          git push
