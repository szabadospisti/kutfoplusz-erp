name: Apply diameter runtime fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'fix: apply diameter runtime') }}
    runs-on: ubuntu-latest
    steps:
      - name: Patch runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo patch