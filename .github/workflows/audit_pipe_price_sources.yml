name: audit pipe price sources
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect price/catalog symbols
        run: |
          set -euo pipefail
          {
            echo '=== PRICE/CATALOG SYMBOLS ==='
            grep -Eo '\b[A-Za-z_$][A-Za-z0-9_$]*(Price|Prices|PriceList|Catalog|catalog)[A-Za-z0-9_$]*\b' all.js index.html quote_ui_fix.js 2>/dev/null | sort -u | head -200 || true
            echo '=== PIPE/CASING PRICE CONTEXT ==='
            grep -Ein -C 2 'b[eé]l[eé]s|sz[uű]r[oő]|cs[oő]vez|PVC|priceList|drillingPriceList|pipe.*price|price.*pipe' all.js index.html quote_ui_fix.js 2>/dev/null | head -500 || true
          } > PIPE_PRICE_AUDIT.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PIPE_PRICE_AUDIT.txt .github/workflows/audit_pipe_price_sources.yml
          git rm .github/workflows/audit_pipe_price_sources.yml
          git commit -m 'chore: audit pipe price sources'
          git push
