name: Inspect native quote recalculation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inspect:
    if: ${{ !contains(github.event.head_commit.message, '[inspect-native-quote]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Print exact native quote snippets
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('index.html').read_text(encoding='utf-8')
          for needle in ['autoDesc','quoteItems[0].qty','quoteItems[0].price','recalculateQuoteMainItem']:
              print('\n===== '+needle+' =====')
              for m in list(re.finditer(re.escape(needle), t, re.I))[:10]:
                  a=max(0,m.start()-700); b=min(len(t),m.end()+1000)
                  print(t[a:b])
                  print('\n---')
          PY
      - name: Remove one-shot inspection workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/inspect-native-quote-recalc.yml
          git commit -m "Inspect native quote recalculation [inspect-native-quote]"
          git push origin HEAD:main
