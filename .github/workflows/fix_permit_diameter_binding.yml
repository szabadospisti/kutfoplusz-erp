name: fix permit diameter binding
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch quote diameter source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('quote_ui_fix.js')
          s=p.read_text(encoding='utf-8')
          start=s.index('  function sectionIdentity(')
          end=s.index('  function ensurePipeCatalogIdentity(', start)
          replacement='''  function projectPermitDiameter(project){\n    try{\n      const w=project?.well||{}, sections=Array.isArray(w.casingSections)?w.casingSections:[];\n      for(const sec of sections){\n        const candidates=[sec?.diameter,sec?.pipeDiameter,sec?.casingDiameter,sec?.technicalData,sec?.technical,sec?.[3]];\n        for(const raw of candidates){\n          const m=String(raw??'').replace(/,/g,'.').match(/(\\d+(?:\\.\\d+)?\\s*\\/\\s*\\d+(?:\\.\\d+)?)\\s*Ø?\\s*mm/i);\n          if(m)return m[1].replace(/\\s+/g,'');\n          const n=String(raw??'').replace(/,/g,'.').match(/(?:Ø\\s*)?(\\d+(?:\\.\\d+)?)\\s*mm/i);\n          if(n)return n[1];\n        }\n      }\n      for(const raw of [project?.name,project?.title,project?.description]){\n        const m=String(raw??'').replace(/,/g,'.').match(/(\\d+(?:\\.\\d+)?\\s*\\/\\s*\\d+(?:\\.\\d+)?)\\s*Ø?\\s*mm/i);\n        if(m)return m[1].replace(/\\s+/g,'');\n      }\n      const d=w.casingDiameter??w.védőcsőÁtmérő;\n      return d!=null?String(d).replace(/,/g,'.').replace(/\\s+/g,''):'';\n    }catch(e){return ''; }\n  }\n  function sectionIdentity(project,section){const d=projectPermitDiameter(project)||'324';const role=normalizeRole(section?.type??section?.[2]);return `CASING|${d}|${role}`;}\n'''
          s=s[:start]+replacement+s[end:]
          start=s.index('  function syncQuoteDiameterFromProject(')
          end=s.index('  function syncQuoteCasingItemsFromProject(', start)
          replacement='''  function syncQuoteDiameterFromProject(){try{const sel=document.getElementById("q_pipe_diameter"),pe=document.getElementById("q_project");if(!sel||!pe||typeof db==="undefined")return;const p=(Array.isArray(db.projects)?db.projects:[]).find(x=>String(x.id)===String(pe.value||""));if(!p)return;const full=projectPermitDiameter(p);if(!full)return;const numeric=String(full).split('/')[0].trim();let opt=[...sel.options].find(o=>String(o.value)===numeric);if(!opt){opt=document.createElement("option");opt.value=numeric;sel.appendChild(opt);}opt.textContent=`Ø ${full} mm`;opt.dataset.fullDiameter=full;sel.value=numeric;sel.dataset.fullDiameter=full;window.recalculateQuoteMainItem&&window.recalculateQuoteMainItem();}catch(e){console.warn("Ajánlat átmérő szinkron:",e);}}\n'''
          s=s[:start]+replacement+s[end:]
          s=s.replace('item.name=resolved.material?.name||`PVC ${type===\'Szűrő\'?"szűrőcső":"béléscső"} Ø${String(p.well?.casingDiameter??324)} mm`;', 'item.name=resolved.material?.name||`PVC ${type===\'Szűrő\'?"szűrőcső":"béléscső"} Ø${projectPermitDiameter(p)||324} mm`;')
          s=s.replace('const PATCH="ERP2.0-PIPE-CATALOG-IDENTITY-FIX-2026-08-30-01";', 'const PATCH="ERP2.0-PERMIT-DIAMETER-BINDING-FIX-2026-08-30-02";')
          p.write_text(s,encoding='utf-8')
          PY
          node --check quote_ui_fix.js
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add quote_ui_fix.js .github/workflows/fix_permit_diameter_binding.yml
          git commit -m 'fix: bind quote diameter to permit pipe size'
          git push
          git rm .github/workflows/fix_permit_diameter_binding.yml
          git commit -m 'chore: remove one-shot diameter patch workflow'
          git push
